name: RivoScan - inspect existing Internal Testing AAB
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivoscan-probe-internal.yml'
      - 'tools/play-publisher/rivoscan_probe_internal.py'
permissions:
  contents: read
concurrency:
  group: google-play-com.ribhlab.rivoscan
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Google Play API client
        run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Inspect saved bundles and actual testing track names
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" || {
            echo 'Missing Play API secret'; exit 1;
          }
          python tools/play-publisher/rivoscan_probe_internal.py
