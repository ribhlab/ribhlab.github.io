name: RivoTalk alpha08 - guarded Production with genuine same-version images
on:
  push:
    branches: [deploy/rivotalk-08-stage-only-20261127]
    paths:
      - tools/play-publisher/rivotalk_08_promote_with_real_media.py
      - .github/workflows/rivotalk-alpha08-production-real-screens.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: google-play-com.ribhlab.rivotalk
  cancel-in-progress: false
jobs:
  production-update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: play-production
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      ORIGINAL_UPLOAD_SHA1: E9:B3:E2:77:95:75:BA:08:A9:13:72:FC:38:85:EB:A0:1D:D3:E7:3E
      RIVOTALK_08_PROMOTION_CONFIRM: SUBMIT_EXACT_RIVOTALK_08_PRODUCTION_WITH_GENUINE_MATCHING_SCREENSHOTS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Check original Play publisher and pixel-validation dependencies
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}"
          python3 -m pip install -r tools/play-publisher/requirements.txt 'Pillow>=11,<13'
          python3 -m py_compile tools/play-publisher/rivotalk_08_promote_with_real_media.py
      - name: Download and independently verify latest signed RivoTalk alpha08 artifacts
        shell: bash
        run: |
          set -euo pipefail
          RELEASE=rivotalk-alpha08-verified-46066995016
          SOURCE=73ba801e900882a8e7c9bd9514d7ac6835de190e
          origin="$(gh api "repos/univcours/ribhlab/releases/tags/$RELEASE" --jq '.target_commitish')"
          test "$origin" = "$SOURCE"
          mkdir -p rivotalk-signed
          gh release download "$RELEASE" --repo univcours/ribhlab --dir rivotalk-signed \
            --pattern 'RivoTalk-0.1.0-alpha08-RivoScan-SIGNED.aab' \
            --pattern 'RivoTalk-0.1.0-alpha08-RivoScan-SIGNED.apk' \
            --pattern 'SHA256SUMS.txt'
          (cd rivotalk-signed && sha256sum -c SHA256SUMS.txt)
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -r | head -1)"
          "$SDKMANAGER" --install 'build-tools;36.0.0'
          APK=rivotalk-signed/RivoTalk-0.1.0-alpha08-RivoScan-SIGNED.apk
          AAB=rivotalk-signed/RivoTalk-0.1.0-alpha08-RivoScan-SIGNED.aab
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | \
            grep -F "package: name='com.ribhlab.rivotalk' versionCode='8' versionName='0.1.0-alpha08'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/rivotalk-signed-cert.txt"
          grep -Fi "$(echo "$ORIGINAL_UPLOAD_SHA1" | tr -d ':' | tr '[:upper:]' '[:lower:]')" "$RUNNER_TEMP/rivotalk-signed-cert.txt"
          jarsigner -verify "$AAB" > "$RUNNER_TEMP/rivotalk-aab-jarsigner.txt" 2>&1
          grep -Fq 'jar verified' "$RUNNER_TEMP/rivotalk-aab-jarsigner.txt"
          keytool -printcert -jarfile "$AAB" | grep -F "SHA1: $ORIGINAL_UPLOAD_SHA1"
      - name: Download ONLY genuine same-version Alpha08 screenshots
        shell: bash
        run: |
          set -euo pipefail
          RELEASE=rivotalk-alpha08-genuine-screenshots
          mkdir -p rivotalk-media
          gh release download "$RELEASE" --repo univcours/ribhlab --dir rivotalk-media \
            --pattern '01-home.png' --pattern '04-settings.png' \
            --pattern '01-home.xml' --pattern '04-settings.xml' \
            --pattern 'APP_IDENTITY.txt' --pattern 'SHA256SUMS.txt' \
            --pattern 'CAPTURE_WORKFLOW_SOURCE_SHA.txt'
          (cd rivotalk-media && sha256sum -c SHA256SUMS.txt)
          grep -Fq 'versionCode=8' rivotalk-media/APP_IDENTITY.txt
          test -s rivotalk-media/01-home.xml
          test -s rivotalk-media/04-settings.xml
      - name: Atomically submit exactly code8 and its genuine Android captures to Google Play
        shell: bash
        run: |
          set -euo pipefail
          python3 -u tools/play-publisher/rivotalk_08_promote_with_real_media.py
          echo 'RivoTalk code8 and genuine same-version screenshots were submitted together. Google review and public availability still require independent verification.' >> "$GITHUB_STEP_SUMMARY"
