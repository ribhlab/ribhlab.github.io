name: Etsy — CashFlow Pro v2.2 Draft
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etsy-cashflow-v22-draft.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etsy-cashflow-v22-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Etsy and create or reuse the CashFlow draft
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python -m py_compile tools/etsy-publisher/scripts/create_cashflow_v22_draft.py
          python tools/etsy-publisher/scripts/create_cashflow_v22_draft.py
