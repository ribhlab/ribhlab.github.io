name: Etsy — Add real-screenshot ProfitLens listing video
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etsy-profitlens-free-video.yml'
      - 'tools/etsy-publisher/scripts/etsy_profitlens_free_video.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etsy-profitlens-authentic-listing-video
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and Etsy dependencies
        run: |
          python -m pip install --disable-pip-version-check 'requests>=2.32,<3' 'Pillow>=11,<13'
          ffmpeg -version | head -1
      - name: Verify authentic existing Etsy images and upload one silent video
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          python -m py_compile tools/etsy-publisher/scripts/etsy_profitlens_free_video.py
          python tools/etsy-publisher/scripts/etsy_profitlens_free_video.py
