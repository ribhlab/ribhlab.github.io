name: Etsy — Free organic SEO title correction
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etsy-organic-seo-title.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etsy-profitlens-organic-title
  cancel-in-progress: false

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify active listings; change ProfitLens title only if unchanged baseline
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          python -m py_compile tools/etsy-publisher/scripts/etsy_organic_seo_title.py
          python tools/etsy-publisher/scripts/etsy_organic_seo_title.py
