name: RivoScan 0.45.25 - update Play listing and release name ONLY
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivoscan-04525-metadata-only.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: google-play-com.ribhlab.rivoscan
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: play-testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Play API dependencies
        run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Verify script and exact package scope
        run: |
          python -m py_compile tools/play-publisher/rivoscan_04525_metadata_only.py
          grep -F 'PACKAGE="com.ribhlab.rivoscan"' tools/play-publisher/rivoscan_04525_metadata_only.py
      - name: Update English listing descriptions and version 129 release metadata only
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" || exit 1
          python tools/play-publisher/rivoscan_04525_metadata_only.py
