name: RivoScan - publish real Android phone screenshots
on:
  push:
    branches: [main]
    paths:
      - tools/play-publisher/store-listings/rivoscan-screenshots-request.json
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: google-play-com.ribhlab.rivoscan
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: play-testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r tools/play-publisher/requirements.txt
          python -m pip install 'Pillow>=11,<13'
      - name: Inspect locked request
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('tools/play-publisher/store-listings/rivoscan-screenshots-request.json').read_text())
          if set(a)!={'enabled','appId','confirmation'}:
              raise SystemExit('Invalid fields')
          if a['appId']!='com.ribhlab.rivoscan' or type(a['enabled']) is not bool:
              raise SystemExit('Wrong app or invalid enabled')
          if a['enabled'] and a['confirmation']!='UPLOAD_REAL_SCREENSHOTS':
              raise SystemExit('Upload needs explicit confirmation')
          Path('/tmp/rivoscan_upload_screenshots_enabled').write_text(
            'true' if a['enabled'] else 'false')
          PY
      - name: Render real emulator captures to Play-compatible JPEG (no fake UI)
        run: |
          python tools/play-publisher/rivoscan_real_screenshots.py
      - name: Upload genuine captures only when enabled
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(cat /tmp/rivoscan_upload_screenshots_enabled)" != "true" ]]; then
            echo "SCREENSHOT_PREVIEW_ONLY"
            exit 0
          fi
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" || { echo "Missing Play API secret"; exit 1; }
          python tools/play-publisher/rivoscan_real_screenshots.py --apply --confirm UPLOAD_REAL_SCREENSHOTS
