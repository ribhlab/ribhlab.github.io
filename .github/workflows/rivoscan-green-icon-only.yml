name: RivoScan - fix blue Play Store icon to owner green
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivoscan-green-icon-only.yml'
      - 'tools/play-publisher/rivoscan_green_icon_only.py'

permissions:
  contents: read

concurrency:
  group: google-play-com.ribhlab.rivoscan
  cancel-in-progress: false

jobs:
  replace-icon:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: play-testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Play publisher including green icon verification
        run: python -m unittest discover tools/play-publisher -p 'test_*.py' -q
      - name: Install Google Play Android Publisher client and image processing
        run: |
          python -m pip install -r tools/play-publisher/requirements.txt
          python -m pip install 'Pillow>=11,<13'
      - name: Replace blue app icon in default en-US listing only
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" || {
            echo 'Missing Google Play credentials. No icon changed.'; exit 1;
          }
          python tools/play-publisher/rivoscan_green_icon_only.py --apply --confirm REPLACE_RIVOSCAN_BLUE_ICON_WITH_OWNER_GREEN
      - name: Report scope
        if: always()
        run: |
          {
            echo '### RivoScan owner green store icon'
            echo '- Only the en-US default Play Store icon is targeted.'
            echo '- Owner-approved 512x512 green icon with SHA-256 pinning.'
            echo '- Feature graphic, screenshots, testing tracks, and AAB are untouched.'
            echo '- Google Play may reject store listing edits before required first app upload.'
          } >> "$GITHUB_STEP_SUMMARY"
