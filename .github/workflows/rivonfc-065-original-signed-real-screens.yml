name: RivoNFC 0.6.5 - real store media from original-key signed code12 APK
on:
  push:
    branches: [qa/rivonfc-065-real-signed-screens-20261127]
    paths:
      - '.github/workflows/rivonfc-065-original-signed-real-screens.yml'
      - 'tools/play-publisher/rivonfc_065_capture_real_screens.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  capture-native-signed-code12:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SIGNER_SHA1: E9:B3:E2:77:95:75:BA:08:A9:13:72:FC:38:85:EB:A0:1D:D3:E7:3E
      EXPECTED_APK_SHA256: 59f010f054b3c98880a0ffdb286e55227b3b6740c0c67bcaa38e4620e3e42a07
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Get exact public original RivoScan key signed APK and verify release provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signed
          APK=signed/RivoNFC-0.6.5-RivoScan-SIGNED.apk
          curl -fSL --retry 4 --connect-timeout 20 \
            'https://github.com/univcours/ribhlab/releases/download/rivonfc-v0.6.5-rivoscan-signed/RivoNFC-0.6.5-RivoScan-SIGNED.apk' -o "$APK"
          echo "$EXPECTED_APK_SHA256  $APK" | sha256sum -c
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -r | head -1)"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | \
            grep -F "package: name='com.ribhlab.rivonfc' versionCode='12' versionName='0.6.5'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/nfc11-certificate.txt"
          grep -Fi "$(echo "$EXPECTED_SIGNER_SHA1" | tr -d ':' | tr '[:upper:]' '[:lower:]')" "$RUNNER_TEMP/nfc11-certificate.txt"
          python3 -m py_compile tools/play-publisher/rivonfc_065_capture_real_screens.py
          echo 'RIVONFC_065_CERTIFIED_RELEASE_APK=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Enable isolated Android 35 emulator acceleration
        shell: bash
        run: |
          set -euo pipefail
          if test -c /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Capture genuine signed code12 Scan, Write, Tools, History pages
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 680
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-snapshot -no-boot-anim
          script: python3 tools/play-publisher/rivonfc_065_capture_real_screens.py
      - name: Verify exactly four matching-version genuine PNG screenshots and evidence
        run: |
          set -euo pipefail
          (cd rivonfc-code12-store && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          from pathlib import Path
          import json
          folder=Path('rivonfc-code12-store')
          m=json.loads((folder/'CAPTURE-MANIFEST.json').read_text())
          assert m['package']=='com.ribhlab.rivonfc'
          assert m['versionCode']==11 and m['versionName']=='0.6.5'
          assert m['capture']=='signed-release-APK-Android35-adb-no-synthetic-content'
          assert m['noLiveAdRequests'] is True and m['simulatedNfcReads'] is False
          assert len(m['screens'])==4
          for item in m['screens']:
              assert (folder/item['file']).stat().st_size>16000
              assert (folder/item['hierarchy']).stat().st_size>100
          print('RIVONFC_065_ORIGINAL_SIGNED_REAL_PNGS_AND_UI_XML=PASS')
          PY
      - name: Preserve original Play-ready genuine code12 screenshot set
        uses: actions/upload-artifact@v4
        with:
          name: RivoNFC-065-Code12-OriginalSigned-Genuine-StoreMedia
          path: rivonfc-code12-store/
          if-no-files-found: error
          retention-days: 7
      - name: Publish eligibility note
        run: |
          echo 'RivoNFC signed code12 real screens captured and preserved; no Play track or metadata edited, pending truthful live Ads and Data safety declarations.' >> "$GITHUB_STEP_SUMMARY"
