name: RivoScan 0.45.25 - upload owner icon ONLY
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivoscan-04525-icon-only.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: google-play-com.ribhlab.rivoscan
  cancel-in-progress: false
jobs:
  icon:
    runs-on: ubuntu-latest
    environment: play-testing
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Play publisher and image verification
        run: |
          python -m pip install -r tools/play-publisher/requirements.txt
          python -m pip install 'Pillow>=11,<13'
      - name: Verify icon-only publisher
        run: python -m py_compile tools/play-publisher/rivoscan_04525_icon_only.py
      - name: Upload verified owner icon ONLY
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" || exit 1
          python tools/play-publisher/rivoscan_04525_icon_only.py
