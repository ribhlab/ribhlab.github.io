name: RivoSticker 1.0.5 - one-time encrypted Play publisher credential handoff
on:
  push:
    branches: [main]
    paths: ['handoff/rivosticker-v105/recipient.crt']
permissions:
  contents: read
jobs:
  encrypt:
    runs-on: ubuntu-latest
    environment: play-testing
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate recipient and encrypt existing Google Play service account
        shell: bash
        env:
          GOOGLE_PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${GOOGLE_PLAY_JSON:-}" || { echo '::error::Existing service account secret unavailable'; exit 1; }
          CERT=handoff/rivosticker-v105/recipient.crt
          openssl x509 -in "$CERT" -noout -subject -dates | grep -F RivoSticker-1.0.5
          openssl x509 -in "$CERT" -pubkey -noout | openssl pkey -pubin -text -noout | grep -E 'RSA Public-Key: \(3072 bit\)|Public-Key: \(3072 bit\)'
          printf '%s' "$GOOGLE_PLAY_JSON" > "$RUNNER_TEMP/play.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP']+'/play.json') as f: j=json.load(f)
          assert j['type']=='service_account' and 'private_key' in j
          print('Service account structure validated without printing any secret')
          PY
          openssl cms -encrypt -binary -aes256 -in "$RUNNER_TEMP/play.json" -recip "$CERT" -outform DER -out "$RUNNER_TEMP/play.cms"
          echo 'RIVOSTICKER_V105_ENCRYPTED_PLAY_CMS_B64_START'
          base64 -w0 "$RUNNER_TEMP/play.cms"
          echo
          echo 'RIVOSTICKER_V105_ENCRYPTED_PLAY_CMS_B64_END'
          echo 'Google Play service account encrypted for the one-time certificate without disclosing plaintext.' >> "$GITHUB_STEP_SUMMARY"
      - name: Destroy temporary plaintext service account
        if: always()
        run: rm -f "$RUNNER_TEMP/play.json" "$RUNNER_TEMP/play.cms"