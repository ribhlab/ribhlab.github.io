name: Check published recipe photo delivery
on:
  push:
    paths:
      - ".github/workflows/recipe-photo-delivery-smoke.yml"
      - "content/recipes/curated-photos.json"
      - "content/recipes/photo-library.json"
      - "public/assets/recipe-pages.css"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify full images and recipe video links
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const css=fs.readFileSync('public/assets/recipe-pages.css','utf8');
          const code=fs.readFileSync('src/recipe-pages.mjs','utf8');
          if(!/\.recipe-card img\[data-recipe-photo\][^{]*\{[^}]*object-fit:contain/.test(css))throw Error('Card photographs can be cropped');
          if(!/\.recipe-photo-figure img\{[^}]*object-fit:contain/.test(css))throw Error('Full recipe photographs can be cropped');
          if(!code.includes('youtube.com/results?search_query=')||!code.includes('recipe-video-link'))throw Error('Recipe YouTube suggestions missing');
          const curated=JSON.parse(fs.readFileSync('content/recipes/curated-photos.json','utf8')).photos;
          const library=JSON.parse(fs.readFileSync('content/recipes/photo-library.json','utf8'));
          const ids=new Set(),urls=new Set();
          for(const [slug,p] of [...Object.entries(curated),...Object.entries(library.assignments).map(([slug,id])=>[slug,library.photos[id]])]){
            if(!p?.url||!p?.source)throw Error('Missing image metadata '+slug);
            const key=p.id||p.photoId;
            if(ids.has(key)||urls.has(p.url.split('?')[0]))throw Error('Duplicate photo '+slug);
            ids.add(key);urls.add(p.url.split('?')[0]);
          }
          console.log('Unique photos',ids.size,'of 120; missing',120-ids.size,'; CSS full-photo containment and YouTube search links verified');
          NODE
      - name: Check all curated photo image endpoints
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('content/recipes/curated-photos.json','utf8')).photos;
          const lib=JSON.parse(fs.readFileSync('content/recipes/photo-library.json','utf8'));
          const entries=[...Object.entries(p),...Object.entries(lib.assignments).map(([slug,id])=>[slug,lib.photos[id]])],problems=[],rateLimited=[];
          let nextIndex=0,done=0;
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function worker(){
            while(nextIndex<entries.length){
              const [slug,pic]=entries[nextIndex++];
              const url=pic?.url;
              if(!url){problems.push(slug+': missing URL');continue;}
              try {
                let checked=false;
                for(let attempt=0;attempt<3;attempt++){
                  const res=await fetch(url,{method:'GET',signal:AbortSignal.timeout(15000),headers:{'User-Agent':'RibhLab photo audit (https://ribhlab.github.io)'}});
                  const ct=res.headers.get('content-type')||'';
                  await res.body?.cancel();
                  if(res.status===429){
                    if(attempt===2){rateLimited.push(slug);checked=true;}
                    else await sleep(1200*(attempt+1));
                    continue;
                  }
                  if(!res.ok||!ct.startsWith('image/'))problems.push(slug+': HTTP '+res.status+' '+ct);
                  checked=true;break;
                }
                if(!checked)problems.push(slug+': not checked');
              }catch(e){problems.push(slug+': '+e.message);}
              done++;await sleep(250);
            }
          }
          await Promise.all(Array.from({length:2},()=>worker()));
          console.log('CHECKED',done,'all assigned recipe photos; confirmed broken',problems.length,'; rate-limited and unverified',rateLimited.length,rateLimited.join(', '));
          if(problems.length)throw Error('Failed live images: '+problems.join('; '));
          NODE
