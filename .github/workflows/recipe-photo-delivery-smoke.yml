name: Check published recipe photo delivery
on:
  push:
    paths: [".github/workflows/recipe-photo-delivery-smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check sample photo image endpoints
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('content/recipes/curated-photos.json','utf8')).photos;
          const entries=Object.entries(p),problems=[];
          let nextIndex=0,done=0;
          async function worker(){
            while(nextIndex<entries.length){
              const [slug,pic]=entries[nextIndex++];
              const url=pic?.url;
              if(!url){problems.push(slug+': missing URL');continue;}
              try {
                const res=await fetch(url,{method:'GET',signal:AbortSignal.timeout(15000),headers:{'User-Agent':'RibhLab photo audit (https://ribhlab.github.io)'}});
                const ct=res.headers.get('content-type')||'';
                if(!res.ok||!ct.startsWith('image/'))problems.push(slug+': HTTP '+res.status+' '+ct);
                await res.body?.cancel();
              }catch(e){problems.push(slug+': '+e.message);}
              done++;
            }
          }
          await Promise.all(Array.from({length:5},()=>worker()));
          console.log('CHECKED',done,'curated recipe photos; broken',problems.length);
          if(problems.length)throw Error('Failed live images: '+problems.join('; '));
          NODE
