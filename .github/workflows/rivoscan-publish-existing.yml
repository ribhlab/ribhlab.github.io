name: RivoScan - publish AAB already uploaded in Play Console

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Exact RivoScan versionCode already uploaded and saved in Play Console'
        required: true
        type: string
      track:
        description: 'Target Google Play track'
        required: true
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      release_status:
        description: 'draft keeps the release unpublished, completed distributes to eligible users'
        required: true
        type: choice
        options: [draft, completed]
        default: draft
      release_notes:
        description: 'What is new? English release notes (up to 500 chars)'
        required: false
        type: string
        default: 'Initial RivoScan Android release.'
      confirm:
        description: 'Type COMMIT to authorize an API edit; leave blank to block changes'
        required: false
        type: string
      production_confirmation:
        description: 'For completed Production only: type PUBLISH'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: google-play-com.ribhlab.rivoscan
  cancel-in-progress: false

jobs:
  publish-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # To enforce additional approval, add reviewers in Settings > Environments > play-production
    environment: ${{ inputs.track == 'production' && 'play-production' || 'play-testing' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (no Google API access)
        run: python -m unittest discover tools/play-publisher -p 'test_*.py' -v
      - name: Install Google Play API client
        run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Assign existing RivoScan bundle to chosen release track
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ inputs.version_code }}
          TRACK: ${{ inputs.track }}
          STATUS: ${{ inputs.release_status }}
          NOTES: ${{ inputs.release_notes }}
          CONFIRM_COMMIT: ${{ inputs.confirm }}
          CONFIRM_PROD: ${{ inputs.production_confirmation }}
        run: |
          set -euo pipefail
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || { echo 'version_code must be a positive integer'; exit 1; }
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" || { echo 'Missing Google Play credential secret'; exit 1; }
          python tools/play-publisher/publish_existing.py \
            --package com.ribhlab.rivoscan \
            --version-code "$VERSION_CODE" \
            --track "$TRACK" \
            --status "$STATUS" \
            --notes "$NOTES" \
            --confirm-commit "$CONFIRM_COMMIT" \
            --confirm-production "$CONFIRM_PROD"
