name: RivoMeasure 1.3.10 - guarded Production + real matching code14 app screens
on:
  push:
    branches: [deploy/rivomeasure-1310-code14-20261127]
    paths:
      - .github/workflows/rivomeasure-1310-production-verified-real-screens.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: google-play-com.ribhlab.ribhmeasure-production14
  cancel-in-progress: false
jobs:
  real-code14-production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: play-production
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      STAGING_RUN: '46072392892'
      SOURCE_RUN: '46072003621'
      SOURCE_SHA: 818fc795f9fdb44291818a2b48567ebf3dcd420a
      EXPECTED_UPLOAD_SHA1: E9:B3:E2:77:95:75:BA:08:A9:13:72:FC:38:85:EB:A0:1D:D3:E7:3E
      RIVOMEASURE_1310_PRODUCTION_CONFIRM: SUBMIT_RIVOMEASURE_1310_CODE14_PRODUCTION_WITH_REAL_SIGNED_APK_SCREENS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Require successful isolated code14 staging before any Production edit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess,time
          run=os.environ["STAGING_RUN"]
          for attempt in range(75):
              x=json.loads(subprocess.check_output(["gh","api",
                  f"repos/ribhlab/ribhlab.github.io/actions/runs/{run}"],text=True))
              if x.get('status')=='completed':
                  if x.get('conclusion')!='success':
                      raise SystemExit("Code14 Play bundle staging did not succeed; no Production edit")
                  print("RIVOMEASURE_1310_PLAY_LIBRARY_STAGING=VERIFIED",flush=True)
                  break
              if attempt==74:raise SystemExit("Play bundle staging not confirmed; no Production edit")
              time.sleep(8)
          PY
      - name: Restore only exact certified signed RivoMeasure v1.3.10 source APK/AAB
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}"
          mkdir -p signed-1310
          actual="$(gh api "repos/univcours/ribhlab/actions/runs/$SOURCE_RUN" --jq '.head_sha')"
          test "$actual" = "$SOURCE_SHA"
          gh run download "$SOURCE_RUN" --repo univcours/ribhlab \
            --name RivoMeasure-1310-code14-original-key-signed-candidate --dir signed-1310
          (cd signed-1310 && sha256sum -c SHA256SUMS.txt)
          APK=signed-1310/RivoMeasure-v1.3.10-code14-original-SIGNED.apk
          AAB=signed-1310/RivoMeasure-v1.3.10-code14-original-SIGNED.aab
          test -s "$APK" && test -s "$AAB"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -r | head -1)"
          "$SDKMANAGER" --install 'build-tools;36.0.0'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | \
            grep -F "package: name='com.ribhlab.ribhmeasure' versionCode='14' versionName='1.3.10'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/measure14-apk-signer.txt"
          grep -Fi "$(echo "$EXPECTED_UPLOAD_SHA1" | tr -d ':' | tr '[:upper:]' '[:lower:]')" "$RUNNER_TEMP/measure14-apk-signer.txt"
          jarsigner -verify "$AAB" > "$RUNNER_TEMP/measure14-aab-signer.txt" 2>&1
          grep -F 'jar verified' "$RUNNER_TEMP/measure14-aab-signer.txt"
          keytool -printcert -jarfile "$AAB" | grep -F "SHA1: $EXPECTED_UPLOAD_SHA1"
      - name: Download source-controlled real Android screenshot QA capture from pinned review commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          gh api 'repos/univcours/ribhlab/contents/qa/ribhmeasure/real_store_screens_1310.py?ref=df748ce57041486bbce2c4be7e4e49621c672115' --jq .content \
            | tr -d '\n' | base64 -d > qa/real_store_screens_1310.py
          python3 -m py_compile qa/real_store_screens_1310.py
          python3 -m pip install -r tools/play-publisher/requirements.txt 'Pillow>=11,<13'
          python3 -m py_compile tools/play-publisher/rivomeasure_1310_production_real_media.py
      - name: Enable emulator acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Capture genuine version14 Home and Settings, not old screenshots or fake mock-ups
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 700
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: python3 qa/real_store_screens_1310.py --apk signed-1310/RivoMeasure-v1.3.10-code14-original-SIGNED.apk --out code14-store
      - name: Submit original-key code14 to Google Play Production with only real code14 images
        shell: bash
        run: |
          set -euo pipefail
          python3 -u tools/play-publisher/rivomeasure_1310_production_real_media.py
          echo 'Production code14 and two genuine signed-version emulator screenshots have been submitted to Google Play; final public availability requires lifecycle verification.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve authentic screenshot evidence when GitHub artifact quota permits
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: RivoMeasure-1310-Original-Signed-Real-Store-Screens
          path: code14-store/
          if-no-files-found: ignore
          retention-days: 7
