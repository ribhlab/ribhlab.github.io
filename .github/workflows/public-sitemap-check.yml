name: Confirm public RibhLab sitemap availability

on:
  workflow_run:
    workflows: ["Publish RibhLab to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-sitemap:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read sitemap, robots.txt and locale homepages over public HTTPS
        run: |
          python3 - <<'PY'
          import time
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          import re

          base='https://ribhlab.github.io'
          wanted=['/','/ads.txt','/robots.txt','/sitemap.xml','/ar/','/en/','/fr/','/ar/opportunities/','/ar/opportunities/competitions/','/ar/opportunities/visa-appointments/','/ar/audience/','/ar/sports/','/en/sports/f1-mexico-gp-preview-2026/','/fr/technology/oppo-find-x10-camera-2026/','/ar/technology/','/ar/technology/apps/','/ar/technology/apps/productivity/','/ar/opportunities/immigration/german-opportunity/','/en/opportunities/immigration/german-opportunity/','/fr/opportunities/immigration/german-opportunity/']
          # Verify the two latest completed editorial articles over public HTTPS,
          # not just the GitHub Pages deployment status.
          for lang in ('ar','en','fr'):
              wanted.append(f'/{lang}/opportunities/competitions/amdie-finance/')
              wanted.append(f'/{lang}/ai/ai-writing-assistant-style-guide-versioning/')
              wanted.append(f'/{lang}/trading/cpi-release-basket-how-read/')
              wanted.append(f'/{lang}/opportunities/competitions/oncf-bac5/')
              wanted.append(f'/{lang}/opportunities/competitions/bam-cyber/')
              wanted.append(f'/{lang}/opportunities/immigration/eures-mobility/')
              wanted.append(f'/{lang}/opportunities/morocco/ram-call/')
              wanted.append(f'/{lang}/opportunities/competitions/agriculture-admin/')
              wanted.append(f'/{lang}/opportunities/companies/sntl-accounting/')
              wanted.append(f'/{lang}/opportunities/competitions/sett-engineer/')
              wanted.append(f'/{lang}/opportunities/morocco/sidi-finance/')
              wanted.append(f'/{lang}/opportunities/companies/marrakech-cash/')
              wanted.append(f'/{lang}/opportunities/competitions/ofppt-accountant-10/')
              wanted.append(f'/{lang}/opportunities/companies/bam-assurances-2026/')
              wanted.append(f'/{lang}/opportunities/competitions/srm-fes-meknes-271/')
              wanted.append(f'/{lang}/opportunities/companies/ram-company/')
              wanted.append(f'/{lang}/opportunities/competitions/lpee-12/')
              wanted.append(f'/{lang}/opportunities/competitions/ofppt-administration-10/')
              wanted.append(f'/{lang}/opportunities/competitions/ofppt-project-10/')
          last=None
          for attempt in range(1,7):
              try:
                  bodies={}
                  for path in wanted:
                      req=urllib.request.Request(base+path,headers={'User-Agent':'RibhLab-Page-Health-Check/1.0'})
                      with urllib.request.urlopen(req,timeout=15) as resp:
                          status=resp.status
                          data=resp.read()
                          mime=resp.headers.get('Content-Type','')
                          print(f'GET {path}: HTTP {status}; type={mime}; bytes={len(data)}',flush=True)
                          assert status==200 and data, f'{path}: empty or non-200 response'
                          bodies[path]=data
                  for lang, heading in [('ar','بطاقة الفرص الألمانية'),('en','Opportunity Card in 2026'),('fr','Carte des opportunités allemande')]:
                      path=f'/{lang}/opportunities/immigration/german-opportunity/'
                      html=bodies[path].decode('utf-8')
                      assert heading in html, f'{lang}: full German opportunity article title missing'
                      assert html.count('opp-guide-section')>=11, f'{lang}: detailed article sections missing'
                      assert 'opp-guide-sources' in html, f'{lang}: official sources missing'
                      print(f'GERMAN OPPORTUNITY LIVE {lang}: detailed article and sources present',flush=True)
                  for lang in ('ar','en','fr'):
                      opp=f'/{lang}/opportunities/competitions/amdie-finance/'
                      html=bodies[opp].decode('utf-8')
                      assert 'AMDIE' in html and 'C44255/26' in html, f'{lang}: AMDIE identity/reference missing'
                      assert html.count('class="opp-guide-section" id="part-')>=10, f'{lang}: AMDIE ten detailed sections missing'
                      assert 'opp-guide-sources' in html and '26fa5f83-f86b-446e-b293-0104f8494b9d' in html, f'{lang}: AMDIE original decision missing'
                      assert 'target="_blank"' in html, f'{lang}: AMDIE external source tab missing'
                      print(f'AMDIE LIVE {lang}: full primary-source recruitment article verified',flush=True)
                      general=f'/{lang}/ai/ai-writing-assistant-style-guide-versioning/'
                      page=bodies[general].decode('utf-8')
                      assert page.count('class="article-block"')>=6, f'{lang}: AI writing article sections missing'
                      assert 'article-sources' in page and 'licensed-editorial-photo' in page, f'{lang}: AI article sources/photo missing'
                      print(f'AI WRITING LIVE {lang}: six sections, sources and photo verified',flush=True)
                      cpi=bodies[f'/{lang}/trading/cpi-release-basket-how-read/'].decode('utf-8')
                      assert cpi.count('class="article-block"')>=5 and 'article-sources' in cpi and 'licensed-editorial-photo' in cpi, f'{lang}: CPI complete article missing'
                      print(f'CPI ARTICLE LIVE {lang}: five sections and sources verified',flush=True)
                      for job_id, source_ref in [('oncf-bac5','0c72b060-b3a6-4d1f-b36a-b01f767b48fe'),('bam-cyber','685d07b8-aa03-4c06-8858-88af9e06cf21')]:
                          job=bodies[f'/{lang}/opportunities/competitions/{job_id}/'].decode('utf-8')
                          assert 'opp-guide-section' in job and 'opp-guide-sources' in job and source_ref in job, f'{lang}: {job_id} evidence article incomplete'
                          assert job.count('class="opp-guide-section" id="part-')>=8, f'{lang}: {job_id} lacks eight sections'
                          print(f'JOB EVIDENCE LIVE {lang}: {job_id} complete and primary source present',flush=True)
                      ram=bodies[f'/{lang}/opportunities/morocco/ram-call/'].decode('utf-8')
                      assert 'Atlas On Line' in ram and 'C44260/26' in ram, f'{lang}: Atlas On Line job reference missing'
                      assert ram.count('class="opp-guide-section" id="part-')>=8, f'{lang}: Atlas On Line full report missing sections'
                      assert 'opp-guide-sources' in ram and '75a63a0e-655b-4db8-8d4a-ffdeed8e61f9' in ram, f'{lang}: original employer PDF missing'
                      print(f'ATLAS ON LINE LIVE {lang}: original-source recruitment report verified',flush=True)
                      agri=bodies[f'/{lang}/opportunities/competitions/agriculture-admin/'].decode('utf-8')
                      assert 'C44077/26' in agri and '7c571fa5-42a7-46a6-8021-aed9ed9ec5f0' in agri, f'{lang}: Agriculture notice/reference missing'
                      assert agri.count('class="opp-guide-section" id="part-')>=8 and 'opp-guide-sources' in agri, f'{lang}: Agriculture original report incomplete'
                      print(f'AGRICULTURE LIVE {lang}: eight sections and signed original PDF verified',flush=True)
                      marrakech=bodies[f'/{lang}/opportunities/companies/marrakech-cash/'].decode('utf-8')
                      assert 'C44277/26' in marrakech and 'Marrakech' in marrakech, f'{lang}: Marrakech cash-control job reference missing'
                      assert marrakech.count('class="opp-guide-section" id="part-')>=9, f'{lang}: Marrakech researched guide lacks nine sections'
                      assert '705f6c1a-b4c6-411e-a1a7-e249a4de0781' in marrakech and 'opp-guide-sources' in marrakech, f'{lang}: Marrakech original three-page PDF/source absent'
                      assert 'target="_blank"' in marrakech, f'{lang}: Marrakech official sources should open new tab'
                      print(f'MARRAKECH CASH LIVE {lang}: nine original-source sections, official PDF and application details',flush=True)
                      ofppt=bodies[f'/{lang}/opportunities/competitions/ofppt-accountant-10/'].decode('utf-8')
                      assert 'RH 135/26' in ofppt and 'C44273/26' in ofppt, f'{lang}: OFPPT notice identity missing'
                      assert ofppt.count('class="opp-guide-section" id="part-')>=10, f'{lang}: OFPPT researched guide lacks ten sections'
                      assert '320ad0af-40dd-4bf2-aa17-c8257e791ac6' in ofppt and 'opp-guide-sources' in ofppt, f'{lang}: OFPPT original PDF/source missing'
                      assert 'target="_blank"' in ofppt, f'{lang}: OFPPT sources must open in new tab'
                      print(f'OFPPT ACCOUNTING LIVE {lang}: ten sections, original PDF, reference and links verified',flush=True)
                      sntl=bodies[f'/{lang}/opportunities/companies/sntl-accounting/'].decode('utf-8')
                      assert 'C44157/26' in sntl and 'SNTL/TCOMP/2026' in sntl, f'{lang}: SNTL accounting references missing'
                      assert sntl.count('class="opp-guide-section" id="part-')>=10, f'{lang}: SNTL detailed report lacks ten sections'
                      assert 'opp-guide-sources' in sntl and 'e7379c18-857e-4135-be2a-53365d665497' in sntl, f'{lang}: SNTL signed notice missing'
                      assert 'target="_blank"' in sntl, f'{lang}: SNTL external official sources must open new tab'
                      print(f'SNTL ACCOUNTING LIVE {lang}: ten original-source sections, references and source links verified',flush=True)
                      engineer=bodies[f'/{lang}/opportunities/competitions/sett-engineer/'].decode('utf-8')
                      assert engineer.count('class="opp-guide-section" id="part-')>=10, f'{lang}: Settat engineer ten researched sections missing'
                      assert 'C44151/26' in engineer and '7cf772aa-1a10-4769-8d24-bf2e5d55a471' in engineer, f'{lang}: Settat official references absent'
                      assert engineer.count('opp-evidence-warning')>=2, f'{lang}: Settat deadline and GIS count conflicts must both be visible'
                      assert '2026-11-02T16:30' in engineer and '2026-11-09T16:30' in engineer, f'{lang}: Settat earlier and later deadlines missing'
                      assert 'opp-guide-sources' in engineer and 'target="_blank"' in engineer, f'{lang}: Settat original PDF and new-tab sources missing'
                      print(f'SETTAT ENGINEER LIVE {lang}: 10 sections, 3 specialties, deadline and headcount conflicts visible',flush=True)
                      sidi=bodies[f'/{lang}/opportunities/morocco/sidi-finance/'].decode('utf-8')
                      assert sidi.count('class="opp-guide-section" id="part-')>=8, f'{lang}: Sidi Bennour finance detailed article missing'
                      assert 'C44257/26' in sidi and 'opp-guide-sources' in sidi, f'{lang}: Sidi Bennour employer reference missing'
                      print(f'SIDI BENNOUR FINANCE LIVE {lang}: original recruitment article and references visible',flush=True)
                      eures=bodies[f'/{lang}/opportunities/immigration/eures-mobility/'].decode('utf-8')
                      assert eures.count('class="opp-guide-section" id="part-')>=8 and 'opp-guide-sources' in eures, f'{lang}: EURES full guide missing'
                      print(f'EURES LIVE {lang}: detailed guide and sources verified',flush=True)
                  ads=bodies['/ads.txt'].decode('utf-8-sig').strip()
                  match=re.fullmatch(r'google\.com, pub-(\d{16}), DIRECT, f08c47fec0942fa0',ads)
                  assert match, 'Public ads.txt must contain a properly formatted real publisher entry'
                  expected_meta=('name="google-adsense-account" content="ca-pub-'+match.group(1)+'"').encode()
                  assert expected_meta in bodies['/'], 'Publisher ownership meta missing from root homepage'
                  for language in ('ar','en','fr'):
                      assert expected_meta in bodies['/'+language+'/'], f'AdSense ownership meta missing for {language} page'
                      assert ('pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-'+match.group(1)).encode() in bodies['/'+language+'/'], 'Official AdSense verification code not found'
                      assert b'<ins class="adsbygoogle"' not in bodies['/'+language+'/'], 'Manual ad units must not be published before approval'
                  print('ADSENSE CONNECT CHECK PASSED: public /ads.txt, ownership metadata, and official loader all match; no manual ad units',flush=True)
                  robots=bodies['/robots.txt'].decode('utf-8-sig')
                  assert 'Sitemap: '+base+'/sitemap.xml' in robots, 'Missing public robots sitemap'
                  assert 'Disallow: /admin/' in robots, 'Expected private editor excluded'
                  doc=ET.fromstring(bodies['/sitemap.xml'])
                  ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
                  assert doc.tag=='{'+ns['s']+'}urlset', f'Unexpected XML root: {doc.tag}'
                  urls=[n.text for n in doc.findall('./s:url/s:loc',ns)]
                  assert len(urls)>=30, f'Only {len(urls)} site URLs'
                  assert len(set(urls))==len(urls), 'Sitemap has duplicate URLs'
                  assert all(u.startswith(base+'/') for u in urls), 'Wrong domain in sitemap'
                  assert all(u not in (base+'/',) for u in urls), 'Redirect-only bare homepage in sitemap'
                  for language in ('ar','en','fr'):
                      assert base+'/'+language+'/' in urls, f'Missing {language} homepage'
                      assert b'<meta name="robots" content="index,follow' in bodies['/'+language+'/'], 'Missing indexing meta'
                  # Sprint articles are only marked published after their real trilingual
                  # pages, editorial sections, sources and licensed photos are visible.
                  for slug in ('gig-description-client-questions-scope','ethereum-smart-contracts-wallet-permissions'):
                      for language in ('ar','en','fr'):
                          matches=[u for u in urls if u.endswith('/'+slug+'/') and '/'+language+'/' in u]
                          assert len(matches)==1, f'{language}: published sprint URL missing or duplicated for {slug}'
                          url=matches[0]
                          req=urllib.request.Request(url,headers={'User-Agent':'RibhLab-Page-Health-Check/1.0'})
                          with urllib.request.urlopen(req,timeout=15) as resp:
                              page=resp.read().decode('utf-8')
                              assert resp.status==200, f'{language}: sprint page not live for {slug}'
                          assert page.count('class="article-block"')>=4, f'{language}: sprint sections missing for {slug}'
                          assert 'article-sources' in page and 'licensed-editorial-photo' in page, f'{language}: sources or photo missing for {slug}'
                          print(f'SPRINT LIVE {language}: {slug} complete and sourced',flush=True)
                  # Verify the new source-checked 271-position SRM-FM guide in each locale.
                  for language in ('ar','en','fr'):
                      page=bodies[f'/{language}/opportunities/competitions/srm-fes-meknes-271/'].decode('utf-8')
                      assert page.count('class="opp-guide-section" id="part-')>=10, f'{language}: SRM-FM guide lacks ten sections'
                      assert 'C44141/26' in page and 'e25c50f3-f5dc-4570-b991-981517e9a17b' in page, f'{language}: SRM-FM official notice missing'
                      assert 'opp-guide-sources' in page and 'target="_blank"' in page, f'{language}: SRM-FM official source links missing'
                      print(f'SRM-FM 271 LIVE {language}: ten researched sections and official decision verified',flush=True)
                  # Verify the original Atlas On Line 30-position notice, including the
                  # employer email versus portal submission conflict in every language.
                  for language in ('ar','en','fr'):
                      page=bodies[f'/{language}/opportunities/companies/ram-company/'].decode('utf-8')
                      assert page.count('class="opp-guide-section" id="part-')>=9, f'{language}: Atlas On Line guide lacks nine sections'
                      assert 'C44260/26' in page and '75a63a0e-655b-4db8-8d4a-ffdeed8e61f9' in page, f'{language}: original Atlas On Line reference missing'
                      assert 'Rh_Aol' in page and 'opp-guide-sources' in page, f'{language}: employer submission channel or sources missing'
                      print(f'ATLAS ON LINE LIVE {language}: nine original sections and both official sources verified',flush=True)
                  # Reconcile campaign records with articles already committed by the gated publisher.
                  for slug,category,min_sections in (
                      ('freelance-basic-standard-premium-cost-model','earning',5),
                      ('godot-first-small-game-five-sessions','ai',6),
                  ):
                      for language in ('ar','en','fr'):
                          matches=[u for u in urls if u.endswith('/'+category+'/'+slug+'/') and '/'+language+'/' in u]
                          assert len(matches)==1, f'{language}: missing sprint page in public sitemap for {slug}'
                          req=urllib.request.Request(matches[0],headers={'User-Agent':'RibhLab-Page-Health-Check/1.0'})
                          with urllib.request.urlopen(req,timeout=15) as resp:
                              article_html=resp.read().decode('utf-8')
                              assert resp.status==200, f'{language}: sprint article not live for {slug}'
                          assert article_html.count('class="article-block"')>=min_sections, f'{language}: {slug} has too few sections'
                          assert 'article-sources' in article_html and 'licensed-editorial-photo' in article_html, f'{language}: missing source/photo for {slug}'
                          print(f'CAMPAIGN LIVE {language}: {slug}, {min_sections}+ sections, sources and licensed photo',flush=True)
                  # Validate the original Bank Al-Maghrib insurance recruitment guide
                  # against live trilingual pages, not only the committed evidence JSON.
                  for language in ('ar','en','fr'):
                      path=f'/{language}/opportunities/companies/bam-assurances-2026/'
                      html=bodies[path].decode('utf-8')
                      assert html.count('class="opp-guide-section" id="part-')>=10, f'{language}: BAM guide has fewer than ten sections'
                      assert 'CSDA/DIL/191026' in html and 'C44144/26' in html, f'{language}: BAM original reference missing'
                      assert 'opp-guide-sources' in html, f'{language}: BAM primary sources missing'
                      print(f'BAM INSURANCE LIVE {language}: ten researched sections and official sources',flush=True)
                  # Verify recently published campaign articles in all three languages before
                  # their sprint statuses are reconciled. This catches broken article routes,
                  # missing editorial sections, source citations, or photo provenance markup.
                  for slug,category,min_sections in (
                      ('gig-gallery-original-images-checklist','earning',4),
                      ('newsletter-start-free-first-90-days','earning',4),
                      ('fixed-versus-trailing-stop-order-frictions','trading',4),
                      ('minimal-skin-routine-cleanser-moisturizer-spf','lifestyle',4),
                      ('power-query-ai-assisted-transformations-audit','ai',8),
                      ('niche-educational-blog-content-audit','earning',6),
                      ('risk-budget-drawdown-math-beginners','trading',5),
                      ('notion-template-originality-support-guide','earning',6),
                      ('safe-excel-ai-analysis-redaction-checklist','ai',5),
                  ):
                      for language in ('ar','en','fr'):
                          matches=[u for u in urls if u.endswith('/'+category+'/'+slug+'/') and '/'+language+'/' in u]
                          assert len(matches)==1, f'{language}: missing published campaign URL for {slug}'
                          req=urllib.request.Request(matches[0],headers={'User-Agent':'RibhLab-Page-Health-Check/1.0'})
                          with urllib.request.urlopen(req,timeout=15) as resp:
                              page=resp.read().decode('utf-8')
                              assert resp.status==200, f'{language}: published campaign page not live for {slug}'
                          assert page.count('class="article-block"')>=min_sections, f'{language}: incomplete editorial sections for {slug}'
                          assert 'article-sources' in page and 'licensed-editorial-photo' in page, f'{language}: sources/photo missing for {slug}'
                          print(f'NEW SPRINT LIVE {language}: {slug} complete and sourced',flush=True)
                  # Verify the 26 October LPEE twelve-position primary-source notice.
                  for language in ('ar','en','fr'):
                      page=bodies[f'/{language}/opportunities/competitions/lpee-12/'].decode('utf-8')
                      assert page.count('class="opp-guide-section" id="part-')>=9, f'{language}: LPEE guide lacks nine detailed sections'
                      assert 'C44291/26' in page and 'AR/910/26/013' in page, f'{language}: LPEE decision identifiers missing'
                      assert '2026/95' in page and '2026/91' in page, f'{language}: LPEE individual offer references missing'
                      assert 'opp-guide-sources' in page and 'target="_blank"' in page, f'{language}: LPEE primary sources absent'
                      print(f'LPEE 12 LIVE {language}: nine original sections, signed PDF and employer pages',flush=True)
                  # Verify OFPPT RH 129/26 guide against the actual public pages.
                  for language in ('ar','en','fr'):
                      page=bodies[f'/{language}/opportunities/competitions/ofppt-administration-10/'].decode('utf-8')
                      assert page.count('class="opp-guide-section" id="part-')>=9, f'{language}: OFPPT admin guide lacks nine sections'
                      assert 'RH 129/26' in page and 'C44254/26' in page, f'{language}: OFPPT admin reference missing'
                      assert 'opp-guide-sources' in page and 'target="_blank"' in page, f'{language}: OFPPT admin official sources missing'
                      print(f'OFPPT ADMIN LIVE {language}: nine original sections and original PDF',flush=True)
                  # Verify OFPPT RH 130/26 project officer guide from the original notice.
                  for language in ('ar','en','fr'):
                      page=bodies[f'/{language}/opportunities/competitions/ofppt-project-10/'].decode('utf-8')
                      assert page.count('class="opp-guide-section" id="part-')>=9, f'{language}: OFPPT project guide lacks nine detailed sections'
                      assert 'RH 130/26' in page and 'C44256/26' in page, f'{language}: OFPPT project references missing'
                      assert 'opp-guide-sources' in page and 'target="_blank"' in page, f'{language}: OFPPT project primary sources missing'
                      print(f'OFPPT PROJECT LIVE {language}: nine sourced sections and original notice',flush=True)
                  print(f'PUBLIC SITE PASSED: XML parsed; {len(urls)} URLs; robots and multilingual pages available',flush=True)
                  break
              except Exception as err:
                  last=err
                  print(f'Public check attempt {attempt}/6 failed: {type(err).__name__}: {err}',flush=True)
                  if attempt<6: time.sleep(8)
          else:
              raise SystemExit('Public sitemap could not be verified: '+str(last))
          PY
