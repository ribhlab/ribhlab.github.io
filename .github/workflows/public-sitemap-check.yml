name: Confirm public RibhLab sitemap availability

on:
  workflow_run:
    workflows: ["Publish RibhLab to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-sitemap:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read sitemap, robots.txt and locale homepages over public HTTPS
        run: |
          python3 - <<'PY'
          import time
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          import re

          base='https://ribhlab.github.io'
          wanted=['/','/ads.txt','/robots.txt','/sitemap.xml','/ar/','/en/','/fr/','/ar/opportunities/','/ar/opportunities/competitions/','/ar/opportunities/visa-appointments/','/ar/audience/','/ar/sports/','/en/sports/f1-mexico-gp-preview-2026/','/fr/technology/oppo-find-x10-camera-2026/','/ar/technology/','/ar/technology/apps/','/ar/technology/apps/productivity/','/ar/opportunities/immigration/german-opportunity/','/en/opportunities/immigration/german-opportunity/','/fr/opportunities/immigration/german-opportunity/']
          # Verify the two latest completed editorial articles over public HTTPS,
          # not just the GitHub Pages deployment status.
          for lang in ('ar','en','fr'):
              wanted.append(f'/{lang}/opportunities/competitions/amdie-finance/')
              wanted.append(f'/{lang}/ai/ai-writing-assistant-style-guide-versioning/')
          last=None
          for attempt in range(1,7):
              try:
                  bodies={}
                  for path in wanted:
                      req=urllib.request.Request(base+path,headers={'User-Agent':'RibhLab-Page-Health-Check/1.0'})
                      with urllib.request.urlopen(req,timeout=15) as resp:
                          status=resp.status
                          data=resp.read()
                          mime=resp.headers.get('Content-Type','')
                          print(f'GET {path}: HTTP {status}; type={mime}; bytes={len(data)}',flush=True)
                          assert status==200 and data, f'{path}: empty or non-200 response'
                          bodies[path]=data
                  for lang, heading in [('ar','بطاقة الفرص الألمانية'),('en','Opportunity Card in 2026'),('fr','Carte des opportunités allemande')]:
                      path=f'/{lang}/opportunities/immigration/german-opportunity/'
                      html=bodies[path].decode('utf-8')
                      assert heading in html, f'{lang}: full German opportunity article title missing'
                      assert html.count('opp-guide-section')>=11, f'{lang}: detailed article sections missing'
                      assert 'opp-guide-sources' in html, f'{lang}: official sources missing'
                      print(f'GERMAN OPPORTUNITY LIVE {lang}: detailed article and sources present',flush=True)
                  for lang in ('ar','en','fr'):
                      opp=f'/{lang}/opportunities/competitions/amdie-finance/'
                      html=bodies[opp].decode('utf-8')
                      assert 'AMDIE' in html and 'C44255/26' in html, f'{lang}: AMDIE identity/reference missing'
                      assert html.count('class="opp-guide-section"')>=11, f'{lang}: AMDIE ten detailed sections missing'
                      assert 'opp-guide-sources' in html and '26fa5f83-f86b-446e-b293-0104f8494b9d' in html, f'{lang}: AMDIE original decision missing'
                      assert 'target="_blank"' in html, f'{lang}: AMDIE external source tab missing'
                      print(f'AMDIE LIVE {lang}: full primary-source recruitment article verified',flush=True)
                      general=f'/{lang}/ai/ai-writing-assistant-style-guide-versioning/'
                      page=bodies[general].decode('utf-8')
                      assert page.count('class="article-block"')>=6, f'{lang}: AI writing article sections missing'
                      assert 'article-sources' in page and 'licensed-editorial-photo' in page, f'{lang}: AI article sources/photo missing'
                      print(f'AI WRITING LIVE {lang}: six sections, sources and photo verified',flush=True)
                  ads=bodies['/ads.txt'].decode('utf-8-sig').strip()
                  match=re.fullmatch(r'google\.com, pub-(\d{16}), DIRECT, f08c47fec0942fa0',ads)
                  assert match, 'Public ads.txt must contain a properly formatted real publisher entry'
                  expected_meta=('name="google-adsense-account" content="ca-pub-'+match.group(1)+'"').encode()
                  assert expected_meta in bodies['/'], 'Publisher ownership meta missing from root homepage'
                  for language in ('ar','en','fr'):
                      assert expected_meta in bodies['/'+language+'/'], f'AdSense ownership meta missing for {language} page'
                      assert ('pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-'+match.group(1)).encode() in bodies['/'+language+'/'], 'Official AdSense verification code not found'
                      assert b'<ins class="adsbygoogle"' not in bodies['/'+language+'/'], 'Manual ad units must not be published before approval'
                  print('ADSENSE CONNECT CHECK PASSED: public /ads.txt, ownership metadata, and official loader all match; no manual ad units',flush=True)
                  robots=bodies['/robots.txt'].decode('utf-8-sig')
                  assert 'Sitemap: '+base+'/sitemap.xml' in robots, 'Missing public robots sitemap'
                  assert 'Disallow: /admin/' in robots, 'Expected private editor excluded'
                  doc=ET.fromstring(bodies['/sitemap.xml'])
                  ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
                  assert doc.tag=='{'+ns['s']+'}urlset', f'Unexpected XML root: {doc.tag}'
                  urls=[n.text for n in doc.findall('./s:url/s:loc',ns)]
                  assert len(urls)>=30, f'Only {len(urls)} site URLs'
                  assert len(set(urls))==len(urls), 'Sitemap has duplicate URLs'
                  assert all(u.startswith(base+'/') for u in urls), 'Wrong domain in sitemap'
                  assert all(u not in (base+'/',) for u in urls), 'Redirect-only bare homepage in sitemap'
                  for language in ('ar','en','fr'):
                      assert base+'/'+language+'/' in urls, f'Missing {language} homepage'
                      assert b'<meta name="robots" content="index,follow' in bodies['/'+language+'/'], 'Missing indexing meta'
                  print(f'PUBLIC SITE PASSED: XML parsed; {len(urls)} URLs; robots and multilingual pages available',flush=True)
                  break
              except Exception as err:
                  last=err
                  print(f'Public check attempt {attempt}/6 failed: {type(err).__name__}: {err}',flush=True)
                  if attempt<6: time.sleep(8)
          else:
              raise SystemExit('Public sitemap could not be verified: '+str(last))
          PY
