name: RivoScan 0.45.43 - publish AAB to Production preserving all photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivoscan-04543-production-preserve-photos.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: google-play-com.ribhlab.rivoscan
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-latest
    environment: play-testing
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Android Publisher Python API
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tools/play-publisher/requirements.txt
          python -m py_compile tools/play-publisher/rivoscan_04543_prod_only_preserve_images.py
      - name: Download exactly original-key signed RivoScan 0.45.43
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rivoscan-04543
          curl -fL --retry 3 --retry-delay 3 \
            -o /tmp/rivoscan-04543/RivoScan-0.45.43-GooglePlay.aab \
            https://github.com/univcours/ribhlab/releases/download/rivoscan-0.45.43-original-key/RivoScan-0.45.43-GooglePlay.aab
          echo "db122b3f3dc53ff6bdf97632ac312bdb9d568b8f3ec8599512b58328777c0cc0  /tmp/rivoscan-04543/RivoScan-0.45.43-GooglePlay.aab" | sha256sum -c -
          test "$(stat -c %s /tmp/rivoscan-04543/RivoScan-0.45.43-GooglePlay.aab)" = "47743055"
      - name: Publish ONLY v0.45.43 signed AAB to Production, preserve all Play Store images
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" || { echo 'Google Play publisher secret missing'; exit 1; }
          python tools/play-publisher/rivoscan_04543_prod_only_preserve_images.py \
            --aab /tmp/rivoscan-04543/RivoScan-0.45.43-GooglePlay.aab \
            --confirm PUBLISH_RIVOSCAN_04543_PRODUCTION_PRESERVE_ALL_IMAGES
