name: TradingFiew 1.0.3 — publish verified signed v4 to Google Play Production
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tradingfiew-v4-production-publish.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: google-play-tradingfiew-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: play-testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify signed AdMob 1.0.3 bundle, hash and ORIGINAL upload certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tradingfiew-release
          cd /tmp/tradingfiew-release
          BASE=https://github.com/univcours/ribhlab/releases/download/tradingfiew-android-v1.0.3-admob-rivo-key
          for NAME in TradingFiew-Android-1.0.3-RivoScanKey-SIGNED.aab TradingFiew-Android-1.0.3-RivoScanKey-SIGNED.apk SHA256SUMS.txt; do
            curl --fail --location --retry 3 --silent --show-error "$BASE/$NAME" -o "$NAME"
          done
          sha256sum -c SHA256SUMS.txt
          jarsigner -verify TradingFiew-Android-1.0.3-RivoScanKey-SIGNED.aab | grep -F 'jar verified'
          keytool -printcert -jarfile TradingFiew-Android-1.0.3-RivoScanKey-SIGNED.aab |
            grep -Fi 'SHA1: E9:B3:E2:77:95:75:BA:08:A9:13:72:FC:38:85:EB:A0:1D:D3:E7:3E'
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging TradingFiew-Android-1.0.3-RivoScanKey-SIGNED.apk |
            grep -F "name='com.ribhlab.tradingfiew' versionCode='4' versionName='1.0.3'"
          "$AAPT" dump xmltree TradingFiew-Android-1.0.3-RivoScanKey-SIGNED.apk AndroidManifest.xml |
            grep -F 'ca-app-pub-7945572016731367~1161939707'
          echo 'Verified package, versionCode 4, signature, manifest and AdMob APP ID' >> "$GITHUB_STEP_SUMMARY"
      - name: Install official Google Play Publisher API
        run: python3 -m pip install -r tools/play-publisher/requirements.txt
      - name: Publish existing v4 signed bundle as completed Production and verify Play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}"
          python3 tools/play-publisher/tradingfiew_v4_production_publish.py
      - name: Read final Google Play bundle and track state
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: PYTHONPATH=tools/play-publisher python3 tools/play-publisher/tradingfiew_play_audit.py
