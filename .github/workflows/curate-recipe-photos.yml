name: Daily RibhLab recipe photo research
on:
  workflow_dispatch:
  # Revisit missing cards each morning; keep suggestions in a review-only queue.
  schedule:
    - cron: '25 7 * * *'
concurrency:
  group: ribhlab-daily-photo-research
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Find uniquely identifiable commercially reusable food photos
        run: node src/curate-recipe-photos.mjs
      - name: Save unreviewed image suggestions (never auto-publish)
        run: |
          git config user.name "RibhLab Photo Audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/recipes/photo-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "content(images): save photo candidates for editorial review"
            # Repository may have advanced while photo sourcing was running.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
