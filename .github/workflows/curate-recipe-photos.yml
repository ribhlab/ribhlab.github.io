name: Curate unique food photography
on:
  workflow_dispatch:
  push:
    paths:
      - "src/curate-recipe-photos.mjs"
      - ".github/workflows/curate-recipe-photos.yml"
permissions:
  contents: write
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Find uniquely identifiable commercially reusable food photos
        run: node src/curate-recipe-photos.mjs
      - name: Save verified photo metadata
        run: |
          git config user.name "RibhLab Photo Audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/recipes/curated-photos.json
          if ! git diff --cached --quiet; then
            git commit -m "content(images): curate unique licensed food photographs"
            git push origin HEAD:main
          fi
