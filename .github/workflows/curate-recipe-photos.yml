name: Daily RibhLab recipe photo research
on:
  workflow_dispatch:
  push:
    paths:
      - "src/curate-recipe-photos.mjs"
      - "src/audit-recipe-photos.mjs"
      - "src/prune-recipe-photo-candidates.mjs"
      - "content/recipes/photo-review-decisions.json"
      - ".github/workflows/curate-recipe-photos.yml"
  # Revisit missing cards each morning; keep suggestions in a review-only queue.
  schedule:
    - cron: '25 7 * * *'
concurrency:
  group: ribhlab-daily-photo-research
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Find uniquely identifiable commercially reusable food photos
        run: node src/curate-recipe-photos.mjs
      - name: Audit coverage, photo uniqueness, display and video links
        run: node src/audit-recipe-photos.mjs
      - name: Save unreviewed image suggestions and audit report (never auto-publish)
        run: |
          git config user.name "RibhLab Photo Audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/recipes/photo-candidates.json content/recipes/photo-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "content(images): save photo candidates for editorial review"
            # Repository may have advanced while photo sourcing was running.
            git fetch origin main
            # When an editor updated the candidate queue meanwhile, keep the
            # current main-branch review decisions rather than overwriting them.
            # During rebase, 'ours' means the upstream (origin/main) version.
            git rebase -X ours origin/main
            # The main branch may now contain new photo assignments or a manual
            # rejection. Filter against the latest main state before pushing.
            node src/prune-recipe-photo-candidates.mjs
            node src/audit-recipe-photos.mjs
            git add content/recipes/photo-candidates.json content/recipes/photo-audit.json
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            git push origin HEAD:main
          fi
