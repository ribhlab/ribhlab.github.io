name: RivoCaption 0.3.4 - declare Google Play data safety
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivocaption-data-safety.yml'
      - 'tools/play-publisher/rivocaption_data_safety.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: google-play-rivocaption-data-safety
  cancel-in-progress: false
jobs:
  disclosure:
    runs-on: ubuntu-latest
    environment: play-testing
    timeout-minutes: 20
    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      PYTHONPATH: tools/play-publisher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install official Google Play SDK
        run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Validate RivoCaption SDK and user-media Data Safety declarations
        run: python tools/play-publisher/rivocaption_data_safety.py
      - name: Submit required RivoCaption Data Safety CSV to Android Publisher
        run: |
          set -euo pipefail
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
          python tools/play-publisher/rivocaption_data_safety.py --apply --confirm SUBMIT_RIVOCAPTION_VERIFIED_ADMOB_DATA_SAFETY
          echo 'RivoCaption Data Safety submitted for review; media locally processed and advertising SDK data disclosed.' >> "$GITHUB_STEP_SUMMARY"
