name: RivoCaption 0.4.5 code19 verified production publisher
on:
  workflow_dispatch:
    inputs:
      expected_source_commit:
        description: Verified latest RivoCaption source commit SHA (40 hex digits)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: google-play-com.rivocaption.editor
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: play-testing
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Prepare existing RibhLab publisher and verify credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          python -m pip install -r tools/play-publisher/requirements.txt
          python -m py_compile tools/play-publisher/publish.py
      - name: Download and validate exact original-key signed code19 AAB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate
          gh release download rivocaption-v0.4.5-original-key-aab \
            --repo univcours/ribhlab --dir candidate
          test -s candidate/RivoCaption-0.4.5-ORIGINAL-KEY-SIGNED.aab
          (cd candidate && sha256sum --check SHA256SUMS.txt)
          grep -Fx 'VERSION_NAME=0.4.5' candidate/SOURCE-IDENTITY.txt
          grep -Fx 'VERSION_CODE=19' candidate/SOURCE-IDENTITY.txt
          grep -Fx 'PACKAGE=com.rivocaption.editor' candidate/SOURCE-IDENTITY.txt
          grep -Fx "SOURCE_COMMIT=$EXPECTED_SOURCE_SHA" candidate/SOURCE-IDENTITY.txt
          unzip -t candidate/RivoCaption-0.4.5-ORIGINAL-KEY-SIGNED.aab | tail -n 2
          jarsigner -verify candidate/RivoCaption-0.4.5-ORIGINAL-KEY-SIGNED.aab > "$RUNNER_TEMP/aabverify.txt" 2>&1
          grep -Fq 'jar verified' "$RUNNER_TEMP/aabverify.txt"
          keytool -printcert -jarfile candidate/RivoCaption-0.4.5-ORIGINAL-KEY-SIGNED.aab \
            | grep -F 'SHA1: E9:B3:E2:77:95:75:BA:08:A9:13:72:FC:38:85:EB:A0:1D:D3:E7:3E'
      - name: Preflight all Play tracks, draft releases, and historical version codes
        shell: bash
        id: preflight
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,sys
          sys.path.insert(0,"tools/play-publisher")
          from googleapiclient.discovery import build
          from publish import get_credentials
          edits=build("androidpublisher","v3",credentials=get_credentials(),cache_discovery=False).edits()
          pkg="com.rivocaption.editor"
          eid=edits.insert(packageName=pkg,body={}).execute()["id"]
          try:
              args={"packageName":pkg,"editId":eid}
              tracks=edits.tracks().list(**args).execute().get("tracks",[])
              current=[{"track":t.get("track"),"status":r.get("status"),
                        "versions":[str(v) for v in r.get("versionCodes",[])]}
                       for t in tracks for r in t.get("releases",[])]
              print("RIVOCAPTION_PLAY_TRACK_PREFLIGHT="+json.dumps(current))
              if any(r["track"]=="production" and r["status"] not in ("completed",)
                     for r in current):
                  raise RuntimeError("Existing draft/staged/paused production release: review and resolve before replacing it")
              if any("19" in r["versions"] and r["track"]=="production" for r in current):
                  print("RIVOCAPTION_CODE19_ALREADY_LISTED_ON_PRODUCTION=TRUE")
                  with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write("skip_publish=true\n")
              elif any("19" in r["versions"] for r in current):
                  raise RuntimeError("Code19 found on a non-production track; do not duplicate or overwrite")
              elif any(int(v)>=19 for r in current for v in r["versions"]):
                  raise RuntimeError("Play has newer version; refuse to publish stale code19")
              else:
                  with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write("skip_publish=false\n")
          finally:
              edits.delete(packageName=pkg,editId=eid).execute()
          PY
      - name: Publish via the original verified RibhLab Play Publisher
        if: steps.preflight.outputs.skip_publish != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/play-publisher/publish.py \
            --aab candidate/RivoCaption-0.4.5-ORIGINAL-KEY-SIGNED.aab \
            --package com.rivocaption.editor \
            --track production --status completed \
            --name 'RivoCaption 0.4.5 (19)' \
            --notes 'About RivoCaption, native app sharing, multilingual settings, improved video caption studio and safer adaptive AdMob banners.' \
            --language en-US --confirm-production PUBLISH
      - name: Verify Play production track through API, not GitHub job alone
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          sys.path.insert(0,"tools/play-publisher")
          from googleapiclient.discovery import build
          from publish import get_credentials
          edits=build("androidpublisher","v3",credentials=get_credentials(),cache_discovery=False).edits()
          pkg="com.rivocaption.editor"
          eid=edits.insert(packageName=pkg,body={}).execute()["id"]
          try:
              t=edits.tracks().get(packageName=pkg,editId=eid,track="production").execute()
              releases=t.get("releases",[])
              print("RIVOCAPTION_PRODUCTION_API_STATE="+json.dumps(releases))
              assert any("19" in [str(v) for v in r.get("versionCodes",[])]
                         for r in releases), "Code19 absent from Production"
              print("RIVOCAPTION_CODE19_LISTED_ON_PRODUCTION=TRUE")
          finally:
              edits.delete(packageName=pkg,editId=eid).execute()
          PY
          echo 'Production API check completed. Google Play review and rollout are separate.' >> "$GITHUB_STEP_SUMMARY"
