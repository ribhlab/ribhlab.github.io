name: Validate RibhLab source and built site
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/cover-art.mjs
          node --check src/build.mjs
          node --check src/app.js
          node --check src/document-studio.js
          node --check src/document-studio-core.mjs
          node --check src/document-studio-core.test.mjs
          node --check src/check.mjs
          node --check src/update-news.mjs
          node --check src/market-comments.js
          node --check src/responsive-smoke.mjs
      - name: Test offline Document Studio Pro calculations and import safety
        run: npm run test:studio
      - name: Build multilingual pages
        env:
          SITE_URL: https://ribhlab.github.io
        run: |
          npm run build
          npm run check
      - name: Install stable Chrome for browser layout testing
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Check real browser layout and interactions at 320–1440px
        env:
          SITE_URL: https://ribhlab.github.io
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:responsive
      - name: Upload responsive screenshots for design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-previews
          path: dist/responsive-previews/
          if-no-files-found: ignore
      - name: Check generated sitemap, images and monetization disclaimers
        run: |
          test -s dist/sitemap.xml
          # Parse the generated XML; text/URL checks alone do not detect malformed XML.
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          doc=ET.parse('dist/sitemap.xml')
          root=doc.getroot()
          assert root.tag=='{http://www.sitemaps.org/schemas/sitemap/0.9}urlset', root.tag
          urls=[node.text for node in root.findall('./s:url/s:loc',ns)]
          assert len(urls)>=30, f'Only {len(urls)} sitemap URLs'
          assert len(urls)==len(set(urls)), 'Duplicate sitemap entries'
          assert all(u.startswith('https://ribhlab.github.io/') for u in urls), 'Unexpected sitemap hostname'
          assert all('ribhlab-site' not in u for u in urls), 'Old project path leaked into sitemap'
          robots=Path('dist/robots.txt').read_text()
          assert 'Sitemap: https://ribhlab.github.io/sitemap.xml' in robots, 'robots.txt missing sitemap link'
          print(f'Sitemap XML is valid: {len(urls)} canonical URLs on ribhlab.github.io')
          PY
          test -f dist/illustrations/earning.svg
          test -f dist/illustrations/trading.svg
          test -f dist/illustrations/ai.svg
          grep -q 'market-analysis' dist/ar/markets/index.html
          grep -q 'market-digest-grid' dist/ar/markets/index.html
          grep -q 'market-comments.js' dist/ar/markets/read/gold-september-2026-etf-flows/index.html
          grep -q 'images.unsplash.com' dist/fr/markets/read/china-q3-2026-growth/index.html
          grep -q 'href="/ar/tools/speed-test/"' dist/ar/tools/index.html
          grep -q 'speed-start' dist/ar/tools/speed-test/index.html
          grep -q 'words-input' dist/ar/tools/word-counter/index.html
          grep -q 'json-format' dist/ar/tools/json-validator/index.html
          grep -q 'position-units' dist/ar/tools/position-size/index.html
          grep -q 'studio-preview' dist/ar/tools/document-studio/index.html
          grep -q 'rel="sponsored nofollow' dist/ar/article/fiverr-complete-guide-2026/index.html || grep -rlq 'rel="sponsored nofollow' dist/ar/ || exit 1

      - name: Preflight future root custom domain and AdSense ownership without publishing
        env:
          # Deliberately nonexistent testing domain; never assume a domain is purchased.
          SITE_URL: https://ribhlab-preflight.example
          GOOGLE_SITE_VERIFICATION: test-verification-token_1234567890
          ADSENSE_PUBLISHER_ID: ca-pub-1234567890123456
          ENABLE_ADSENSE: 'false'
        run: |
          npm run build
          npm run check
          grep -q 'href="/ar/tools/"' dist/ar/index.html
          grep -q 'https://ribhlab-preflight.example/ar/' dist/sitemap.xml
          grep -q 'https://ribhlab-preflight.example/sitemap.xml' dist/robots.txt
          grep -q 'href="/assets/style.css"' dist/ar/index.html
          grep -q 'name="google-site-verification" content="test-verification-token_1234567890"' dist/ar/index.html
          grep -q 'name="google-site-verification" content="test-verification-token_1234567890"' dist/index.html
          grep -q 'name="google-adsense-account" content="ca-pub-1234567890123456"' dist/index.html
          grep -q 'name="google-adsense-account" content="ca-pub-1234567890123456"' dist/ar/index.html
          grep -q 'google.com, pub-1234567890123456, DIRECT' dist/ads.txt
          ! grep -q 'pagead2.googlesyndication.com/pagead/js' dist/ar/index.html
          test ! -f dist/CNAME

      - name: Simulate approved AdSense disclosure and ad tags only on non-public test domain
        env:
          SITE_URL: https://ribhlab-preflight.example
          ADSENSE_PUBLISHER_ID: ca-pub-1234567890123456
          ENABLE_ADSENSE: 'true'
        run: |
          npm run build
          npm run check
          grep -q 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1234567890123456' dist/ar/index.html
          grep -q 'cookies or similar identifiers' dist/en/privacy/index.html
          grep -q 'ملفات تعريف الارتباط' dist/ar/privacy/index.html
          grep -q 'cookies ou identifiants similaires' dist/fr/privacy/index.html

