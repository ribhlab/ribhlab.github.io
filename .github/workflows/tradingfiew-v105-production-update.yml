name: TradingFiew 1.0.5 — verified R8 Google Play Production update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tradingfiew-v105-production-update.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-play-tradingfiew-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: play-testing
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require real signed Android launch QA pass before changing Production
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 'https://api.github.com/repos/univcours/ribhlab/actions/runs/44510993678' > /tmp/tf105-qa.json
          python3 - <<'PY'
          import json
          state=json.load(open('/tmp/tf105-qa.json'))
          expected_path='.github/workflows/tradingfiew-v105-certified-release.yml'
          expected_sha='ebb09c140e5c77b458ef093cb2ec6e46b3d6da7d'
          if (state.get('id') != 44510993678 or state.get('status') != 'completed'
              or state.get('conclusion') != 'success' or state.get('path') != expected_path
              or state.get('head_sha') != expected_sha):
              raise SystemExit('Signed R8 Android launch smoke test not confirmed; NO Play mutation')
          print('Verified signed R8 TradingFiew 1.0.5 actual Android emulator startup success')
          PY
      - name: Download and independently verify 1.0.5 original-key signed APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tradingfiew-1.0.5
          cd /tmp/tradingfiew-1.0.5
          BASE=https://github.com/univcours/ribhlab/releases/download/tradingfiew-android-v1.0.5
          for NAME in TradingFiew-Android-1.0.5-RivoScanKey-SIGNED.apk TradingFiew-Android-1.0.5-RivoScanKey-SIGNED.aab SHA256SUMS.txt; do
            curl -fsSL --retry 3 "$BASE/$NAME" -o "$NAME"
          done
          sha256sum --check SHA256SUMS.txt
          APK=TradingFiew-Android-1.0.5-RivoScanKey-SIGNED.apk
          AAB=TradingFiew-Android-1.0.5-RivoScanKey-SIGNED.aab
          jarsigner -verify "$AAB" | grep -F 'jar verified'
          keytool -printcert -jarfile "$AAB" | grep -Fi 'SHA1: E9:B3:E2:77:95:75:BA:08:A9:13:72:FC:38:85:EB:A0:1D:D3:E7:3E'
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -F "name='com.ribhlab.tradingfiew' versionCode='6' versionName='1.0.5'"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F 'ca-app-pub-7945572016731367~1161939707'
          echo 'Verified signed APK / AAB: versionCode6, original signer, correct AdMob app ID' >> "$GITHUB_STEP_SUMMARY"
      - name: Install Google Play API client
        run: python3 -m pip install -r tools/play-publisher/requirements.txt
      - name: Atomic verified Production update (no store text or ad campaign changes)
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
          python3 tools/play-publisher/tradingfiew_v6_production_update.py \
            --aab /tmp/tradingfiew-1.0.5/TradingFiew-Android-1.0.5-RivoScanKey-SIGNED.aab \
            --apply --confirm PUBLISH_TRADINGFIEW_6
      - name: Audit Google Play Production state independently
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: PYTHONPATH=tools/play-publisher python3 tools/play-publisher/tradingfiew_play_audit.py
