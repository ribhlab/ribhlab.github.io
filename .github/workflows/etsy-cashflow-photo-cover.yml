name: Etsy — CashFlow photo cover order
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etsy-cashflow-photo-cover.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: etsy-cashflow-photo-cover
  cancel-in-progress: false

jobs:
  cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow and validate script
        run: |
          python -m pip install 'Pillow>=11,<13'
          python -m py_compile tools/etsy-publisher/scripts/cashflow_cover_first.py
      - name: Match all Etsy images and put CFO Cockpit first
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          python tools/etsy-publisher/scripts/cashflow_cover_first.py
