name: RivoSticker 1.0.3 - submit verified AdMob Data Safety declarations
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivosticker-data-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: google-play-rivosticker-data-safety
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    environment: play-testing
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install official Google Play Developer API client
        run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Validate all 782 Data Safety rows and four SDK types
        run: |
          python -m py_compile tools/play-publisher/rivosticker_data_safety.py
          python tools/play-publisher/rivosticker_data_safety.py
      - name: Submit only the RivoSticker Data Safety declaration
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" || { echo 'Play credential missing'; exit 1; }
          PYTHONPATH=tools/play-publisher python tools/play-publisher/rivosticker_data_safety.py \
            --apply --confirm SUBMIT_RIVOSTICKER_VERIFIED_ADMOB_DATA_SAFETY
