name: RibhLab Focus Rescue APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/focus-rescue/**'
      - '.github/workflows/focus-rescue-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/focus-rescue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RibhLab-Focus-Rescue-APK
          path: apps/focus-rescue/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
