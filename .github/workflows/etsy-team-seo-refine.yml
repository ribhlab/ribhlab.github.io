name: Etsy — Team finance SEO search refinement
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etsy-team-seo-refine.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: etsy-team-seo-refine
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refine Team listing title and 13 tags only, preserve all buyer assets
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          python -m py_compile tools/etsy-publisher/scripts/etsy_team_seo_refine.py
          python tools/etsy-publisher/scripts/etsy_team_seo_refine.py
