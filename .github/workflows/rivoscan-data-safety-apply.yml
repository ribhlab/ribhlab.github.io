name: RivoScan - submit audited Play Data Safety for v74
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivoscan-data-safety-apply.yml'
      - 'tools/play-publisher/rivoscan_data_safety.py'
      - 'tools/play-publisher/store-listings/rivoscan-data-safety-candidate-2026-11-07.csv'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-play-com.ribhlab.rivoscan
  cancel-in-progress: false

jobs:
  safety-label:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: play-testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate full CSV and test no-code-run security gates
        run: |
          python -m unittest discover tools/play-publisher -p 'test_rivoscan_data_safety.py' -v
          python tools/play-publisher/rivoscan_data_safety.py
      - name: Install Google Play publisher credentials
        run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Submit Data Safety declaration for exact RivoScan package only
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" || {
            echo 'Google Play publisher secret missing. No declaration submitted.'; exit 1;
          }
          python tools/play-publisher/rivoscan_data_safety.py --apply --confirm RIVOSCAN_DATA_SAFETY_V74_CONFIRM
      - name: Report remaining obligations
        if: always()
        run: |
          {
            echo '### RivoScan Data Safety submission'
            echo '- Candidate declaration describes verified v74 source; AdMob + optional BYOK AI + WebRTC.'
            echo '- A successful API write is not final Google policy approval.'
            echo '- v74 bundles an obsolete policy incorrectly denying ads/AI. Rebuild before public production.'
            echo '- Actual signed binary/runtime SDK audit and other Play Console policy forms remain necessary.'
            echo '- Do not import a different Data Safety CSV; import overwrites earlier form responses.'
          } >> "$GITHUB_STEP_SUMMARY"
