name: RivoScan organic web tools - deployed output verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rivoscan-organic-web-qa.yml','scripts/qa-rivoscan-organic-web.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1 pdf-lib@1.17.1
          npx playwright install --with-deps chromium
          node scripts/qa-rivoscan-organic-web.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RivoScan-Web-Tool-Output-Proof
          path: growth-qa-output/
          if-no-files-found: warn
