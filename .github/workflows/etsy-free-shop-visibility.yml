name: Etsy — Free storefront SEO and browse sections
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etsy-free-shop-visibility.yml'
      - 'tools/etsy-publisher/scripts/etsy_free_shop_visibility.py'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: etsy-free-shop-visibility
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Safely update only storefront title announcement and browse sections if authorized
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          python -m py_compile tools/etsy-publisher/scripts/etsy_free_shop_visibility.py
          python tools/etsy-publisher/scripts/etsy_free_shop_visibility.py
