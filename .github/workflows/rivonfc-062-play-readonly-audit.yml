name: RivoNFC 0.6.2 preflight — Play version and activation status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rivonfc-062-play-readonly-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rivonfc-readonly-preflight
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: play-testing
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Inspect exact RivoNFC Google Play release and listing read-only
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PYTHONPATH: tools/play-publisher
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}"
          python - <<'PY'
          import json
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError
          from publish import get_credentials
          p="com.ribhlab.rivonfc"
          api=build("androidpublisher","v3",credentials=get_credentials(),cache_discovery=False)
          edits=api.edits()
          eid=edits.insert(packageName=p,body={}).execute()["id"]
          kw=dict(packageName=p,editId=eid)
          try:
              tracks=edits.tracks().list(**kw).execute().get("tracks",[])
              mapped={}
              for t in tracks:
                  mapped[t.get("track")]=[{"status":r.get("status"),"versionCodes":r.get("versionCodes"),"name":r.get("name")} for r in t.get("releases",[])]
              bundles=[str(x.get("versionCode")) for x in edits.bundles().list(**kw).execute().get("bundles",[])]
              langs=[x.get("language") for x in edits.listings().list(**kw).execute().get("listings",[])]
              media={}
              for typ in ("icon","featureGraphic","phoneScreenshots"):
                  media[typ]=len(edits.images().list(**kw,language="en-US",imageType=typ).execute().get("images",[]))
              countries={}
              for t in ("production","internal"):
                  try:
                      x=edits.countryavailability().get(**kw,track=t).execute()
                      countries[t]={"countryCount":len(x.get("countries",[])),"restOfWorld":x.get("restOfWorld",False)}
                  except HttpError as e:countries[t]={"status":int(e.resp.status)}
              print("RIVONFC_062_PLAY_PREFLIGHT="+json.dumps({"package":p,"tracks":mapped,"bundles":bundles,"locales":langs,"images":media,"countries":countries},sort_keys=True),flush=True)
              if "production" not in mapped or "internal" not in mapped:raise SystemExit("Expected published tracks missing")
          finally:
              edits.delete(**kw).execute()
          PY
