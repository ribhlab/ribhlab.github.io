name: Google Play Publisher — manual, draft by default
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Existing Play Console applicationId'
        required: true
        type: string
      release_tag:
        description: 'GitHub Release tag containing signed AAB'
        required: true
        type: string
      bundle_asset:
        description: 'Exact AAB asset filename'
        required: true
        type: string
      track:
        description: 'Google Play track'
        required: true
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      release_status:
        description: 'draft = do not distribute; completed = distribute'
        required: true
        type: choice
        options: [draft, completed]
        default: draft
      release_notes:
        description: 'Optional English release notes (up to 500 chars)'
        type: string
        required: false
      production_confirmation:
        description: 'Type PUBLISH for production completed'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: google-play-${{ inputs.package_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.track == 'production' && 'play-production' || 'play-testing' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release inputs
        shell: bash
        env:
          PACKAGE: ${{ inputs.package_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          AAB_ASSET: ${{ inputs.bundle_asset }}
          TRACK: ${{ inputs.track }}
          STATUS: ${{ inputs.release_status }}
          CONFIRM: ${{ inputs.production_confirmation }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$ ]] || { echo 'Invalid package name'; exit 1; }
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]] || { echo 'Invalid release tag'; exit 1; }
          [[ "$AAB_ASSET" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.aab$ ]] || { echo 'Invalid AAB filename'; exit 1; }
          if [[ "$TRACK" == production && "$STATUS" == completed && "$CONFIRM" != PUBLISH ]]; then
            echo 'Production distribution requires PUBLISH confirmation'; exit 1
          fi
      - name: Download signed AAB from Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          AAB_ASSET: ${{ inputs.bundle_asset }}
        run: |
          set -euo pipefail
          mkdir -p play-dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$AAB_ASSET" --dir play-dist
          test -s "play-dist/$AAB_ASSET" || { echo 'Release AAB missing or empty'; exit 1; }
      - name: Preflight tests
        run: python -m unittest discover tools/play-publisher -p 'test_*.py'
      - name: Install Play API client
        run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Prepare and commit Google Play edit
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE: ${{ inputs.package_name }}
          AAB_ASSET: ${{ inputs.bundle_asset }}
          TRACK: ${{ inputs.track }}
          STATUS: ${{ inputs.release_status }}
          NOTES: ${{ inputs.release_notes }}
          CONFIRM: ${{ inputs.production_confirmation }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" || { echo 'Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret'; exit 1; }
          python tools/play-publisher/publish.py \
            --aab "play-dist/$AAB_ASSET" \
            --package "$PACKAGE" \
            --track "$TRACK" \
            --status "$STATUS" \
            --notes "$NOTES" \
            --confirm-production "$CONFIRM"
