name: RivoSticker 1.0.3 - capture real Android screens and upload Play artwork
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivosticker-real-play-media.yml'
      - 'tools/play-publisher/rivosticker_real_media.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: google-play-rivosticker-media
  cancel-in-progress: false
jobs:
  real-android-capture-and-play-upload:
    runs-on: ubuntu-24.04
    environment: play-testing
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Play SDK and genuine Android screenshot dependencies
        run: |
          set -euo pipefail
          python -m pip install -r tools/play-publisher/requirements.txt 'Pillow>=11,<13' 'CairoSVG>=2.8,<3'
          python -m py_compile tools/play-publisher/rivosticker_real_media.py
      - name: Fetch exact original-key-signed RivoSticker APK (not a debug build)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --connect-timeout 30 --output /tmp/rivosticker-v103.apk \
            'https://github.com/univcours/ribhlab/releases/download/rivosticker-v1.0.3/RivoSticker-1.0.3-RivoScan-SIGNED.apk'
          printf '%s  %s\n' '0b61505b21134e1196da975f4f1abb937378a08444b52e29552e891fe7c3c82f' /tmp/rivosticker-v103.apk | sha256sum -c -
      - name: Prepare KVM and free space for real Android emulator
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Capture four distinct actual RivoSticker app screens; verify and publish only those
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PYTHONPATH: tools/play-publisher
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 2048M
          disk-size: 2048M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 2048 -no-metrics
          disable-animations: true
          script: |
            test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" || { echo 'Google Play publishing secret not available'; exit 1; }
            python tools/play-publisher/rivosticker_real_media.py --apk /tmp/rivosticker-v103.apk --output /tmp/rivosticker-real --publish
      - name: Preserve exact unmodified original Android screenshots for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RivoSticker-1.0.3-genuine-Android-screen-captures
          path: /tmp/rivosticker-real/
          if-no-files-found: warn
          retention-days: 30
