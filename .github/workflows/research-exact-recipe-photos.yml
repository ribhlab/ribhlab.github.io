name: Research missing recipe photo matches
on:
  push:
    paths:
      - "src/research-exact-food-photos.mjs"
      - ".github/workflows/research-exact-recipe-photos.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: recipe-photo-match-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Research exact recipe image metadata without publishing
        run: node src/research-exact-food-photos.mjs
      - name: Save proposed photos for human editorial audit
        run: |
          git config user.name "RibhLab Photo Research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/recipes/photo-research.json
          if ! git diff --cached --quiet; then
            git commit -m "content(images): record ingredient-aware Commons research results"
            git fetch origin main
            git rebase -X ours origin/main
            git push origin HEAD:main
          fi
