name: RivoSticker 1.0.3 - publish 7 app-language Play listings
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivosticker-localizations.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: google-play-rivosticker-listings
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    environment: play-testing
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install the Google Play Developer API client
        run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Validate RivoSticker localized listings
        run: |
          python -m py_compile tools/play-publisher/rivosticker_localizations.py
          PYTHONPATH=tools/play-publisher python tools/play-publisher/rivosticker_localizations.py
      - name: Commit app-specific localized store listings to Play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" || exit 1
          PYTHONPATH=tools/play-publisher python tools/play-publisher/rivosticker_localizations.py --apply --confirm LOCALIZE_RIVOSTICKER_EXISTING_PLAY_LISTING
