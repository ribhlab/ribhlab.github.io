name: RivoScan 0.45.26 - publish approved AI art and remove preview video
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivoscan-04526-publish-real-ai-media-no-video.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    name: Build fresh genuine RivoScan UI with approved AI artwork
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: publisher
      - uses: actions/checkout@v4
        with:
          repository: univcours/ribhlab
          ref: rivoscan-standalone-ready
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot artwork tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pil fonts-dejavu-core >/dev/null
      - name: Install and build actual RivoScan 0.45.26 Android WebView interface
        working-directory: source
        run: |
          node -e "const p=require('./package.json');if(p.version!=='0.45.26')process.exit(1)"
          npm install --no-audit --no-fund
          npm run build
          npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Capture actual phone and two tablet UI sets
        working-directory: source
        env:
          RIVO_PHONE_OUTPUT: ${{ github.workspace }}/source/phone
          RIVO_TABLET_OUTPUT: ${{ github.workspace }}/source/tablet
        run: |
          npm run preview -- --host 127.0.0.1 >/tmp/rivo-webview-preview.log 2>&1 &
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node scripts/phone-play-screenshots.mjs
          node scripts/tablet-screenshots.mjs
      - name: Render 24 AI + genuine app UI screenshots, new blue icon, graphic
        run: |
          /usr/bin/python3 publisher/tools/play-publisher/rivoscan_04526_ai_media.py \
            --prepare --source source --output /tmp/rivoscan-04526-play
      - name: Make audit and approved output reproducible
        uses: actions/upload-artifact@v4
        with:
          name: RivoScan-0.45.26-AI-Plus-Real-UI-GooglePlay-Assets
          path: /tmp/rivoscan-04526-play/
          retention-days: 30
          if-no-files-found: error
  publish:
    name: Update the five Google Play image slots and remove old video
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: play-testing
    concurrency:
      group: google-play-com.ribhlab.rivoscan
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: RivoScan-0.45.26-AI-Plus-Real-UI-GooglePlay-Assets
          path: /tmp/rivoscan-04526-play/
      - name: Install Play API client + image tools
        run: |
          python -m pip install -r tools/play-publisher/requirements.txt
          python -m pip install 'Pillow>=11,<13'
      - name: Commit Play Store images and REMOVE existing YouTube promo
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" || {
            echo "::error::Google Play credentials secret not found"; exit 1;
          }
          python tools/play-publisher/rivoscan_04526_ai_media.py \
            --publish --output /tmp/rivoscan-04526-play \
            --confirm PUBLISH_RIVOSCAN_04526_OWNER_AI_MEDIA_REMOVE_VIDEO
      - name: Report exact new Play visuals
        if: success()
        run: |
          echo 'Google Play COMMITTED: blue icon (no wordmark), AI-themed actual app screenshot set (8 phone, 8 seven-inch, 8 ten-inch), new featureGraphic, and removed preview video.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Existing AAB, release track, update status, price, ads declarations, text and metadata retained.' >> "$GITHUB_STEP_SUMMARY"
