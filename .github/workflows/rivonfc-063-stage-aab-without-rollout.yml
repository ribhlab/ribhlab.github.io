name: RivoNFC 0.6.3 — stage verified AAB safely (no rollout)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rivonfc-063-stage-aab-without-rollout.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: google-play-com.ribhlab.rivonfc
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    environment: play-testing
    timeout-minutes: 25
    env:
      RIVONFC_063_STAGE_APPROVAL: STAGE_ONLY_RIVONFC_063_SIGNED_AAB_NO_TRACK_UPDATES
      EXPECTED_AAB_SHA256: 771382d8e73cadcc9bb24535150f414c5dffcb2cf9b27dee53b83f79ddcbd7bb
      EXPECTED_CERT_SHA1: E9:B3:E2:77:95:75:BA:08:A9:13:72:FC:38:85:EB:A0:1D:D3:E7:3E
      PYTHONPATH: tools/play-publisher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Verify pinned original-key-signed release and Python publisher syntax
        run: |
          set -euo pipefail
          mkdir signed
          curl -fLsS --retry 4 --retry-delay 3 --connect-timeout 20 \
            -o signed/RivoNFC-0.6.3-RivoScan-SIGNED.aab \
            https://github.com/univcours/ribhlab/releases/download/rivonfc-v0.6.3-rivoscan-signed/RivoNFC-0.6.3-RivoScan-SIGNED.aab
          test "$(stat -c %s signed/RivoNFC-0.6.3-RivoScan-SIGNED.aab)" -eq 16290677
          echo "$EXPECTED_AAB_SHA256  signed/RivoNFC-0.6.3-RivoScan-SIGNED.aab" | sha256sum -c
          jarsigner -verify signed/RivoNFC-0.6.3-RivoScan-SIGNED.aab | grep 'jar verified'
          keytool -printcert -jarfile signed/RivoNFC-0.6.3-RivoScan-SIGNED.aab | grep -F "SHA1: $EXPECTED_CERT_SHA1"
          python -m py_compile tools/play-publisher/rivonfc_063_stage_signed.py
      - name: Use established Google Play Publisher credentials and library APIs
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}"
          python -m pip install -r tools/play-publisher/requirements.txt
          python tools/play-publisher/rivonfc_063_stage_signed.py
      - name: Record limited staging milestone
        run: |
          echo 'RivoNFC 0.6.3 code 10 signed AAB committed only to Google Play bundle library.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production and Internal Testing remain unchanged pending updated Ads and Data Safety declarations in Play Console.' >> "$GITHUB_STEP_SUMMARY"
