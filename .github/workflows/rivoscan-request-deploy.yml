name: RivoScan - deploy saved Play Console bundle request

on:
  push:
    branches: [main]
    paths:
      - tools/play-publisher/release-requests/rivoscan.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-play-com.ribhlab.rivoscan
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      version_code: ${{ steps.check.outputs.version_code }}
      track: ${{ steps.check.outputs.track }}
      status: ${{ steps.check.outputs.status }}
      confirmation: ${{ steps.check.outputs.production_confirmation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate request without calling Google
        id: check
        run: |
          python -m unittest discover tools/play-publisher -p 'test_*.py' -q
          python tools/play-publisher/validate_release_request.py \
            --file tools/play-publisher/release-requests/rivoscan.json \
            --github-output "$GITHUB_OUTPUT"

  deploy:
    needs: validate
    if: needs.validate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.validate.outputs.track == 'production' && 'play-production' || 'play-testing' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Play client
        run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Assign existing AAB to approved release without binary re-upload
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ needs.validate.outputs.version_code }}
          TRACK: ${{ needs.validate.outputs.track }}
          STATUS: ${{ needs.validate.outputs.status }}
          PROD_CONFIRMATION: ${{ needs.validate.outputs.confirmation }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" || { echo 'Missing Google Play secret'; exit 1; }
          NOTES=$(python -c "import json; print(json.load(open('tools/play-publisher/release-requests/rivoscan.json', encoding='utf-8'))['notes'])")
          python tools/play-publisher/publish_existing.py \
            --package com.ribhlab.rivoscan \
            --version-code "$VERSION_CODE" \
            --track "$TRACK" \
            --status "$STATUS" \
            --notes "$NOTES" \
            --confirm-commit COMMIT \
            --confirm-production "$PROD_CONFIRMATION"
