name: RivoScan 0.45.38 - capture latest real UI screenshots
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivoscan-04538-capture-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact 0.45.38 release source
        uses: actions/checkout@v4
        with:
          repository: univcours/ribhlab
          ref: d27becbf4dcbcf36344308119d5f1fff529debbf
          path: rivoscan-app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build actual RivoScan 0.45.38 WebView
        shell: bash
        run: |
          set -euo pipefail
          cd rivoscan-app
          node -e 'const p=require("./package.json");if(p.version!=="0.45.38")process.exit(1)'
          npm install --no-audit --no-fund
          npm run build
          npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Capture phone and tablet screenshots from real 0.45.38 UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rivoscan-04538
          cd rivoscan-app
          npm run preview -- --host 127.0.0.1 > /tmp/rivoscan-04538-preview.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          RIVO_PHONE_OUTPUT=/tmp/rivoscan-04538/phone node scripts/phone-play-screenshots.mjs
          RIVO_TABLET_OUTPUT=/tmp/rivoscan-04538/tablet node scripts/tablet-screenshots.mjs
      - name: Validate exact 24 unique screenshots and original interface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, struct
          root=pathlib.Path("/tmp/rivoscan-04538")
          paths=[]
          for folder,dim in (("phone/phone",(1080,1920)),("tablet/7-inch",(1080,1920)),("tablet/10-inch",(1536,2560))):
              files=sorted((root/folder).glob("*.png"))
              if len(files)!=8:raise SystemExit(f"{folder}: expected 8, got {len(files)}")
              for f in files:
                  data=f.read_bytes()
                  if data[:8]!=b"\\x89PNG\\r\\n\\x1a\\n" or struct.unpack(">II",data[16:24])!=dim or not 10000<len(data)<8000000:
                      raise SystemExit(f"Invalid real UI capture: {f}")
                  paths.append(f)
          if len(set(hashlib.sha256(f.read_bytes()).digest() for f in paths))!=24:
              raise SystemExit("Duplicate UI captures")
          for audit in (root/"phone/audit.json",root/"tablet/audit.json"):
              a=json.loads(audit.read_text())
              if "0.45.38" not in a["source"] or a["errors"]:raise SystemExit(f"Capture audit failed: {audit}")
          print("RIVOSCAN_04538_CAPTURE_VERIFIED="+json.dumps({"version":"0.45.38","phone":8,"tablet7":8,"tablet10":8,"source":"actual release WebView UI; not native camera/OCR captures"}))
          PY
      - name: Save all original screenshots for visual review
        uses: actions/upload-artifact@v4
        with:
          name: RivoScan-04538-Actual-WebView-Screenshots-24
          path: /tmp/rivoscan-04538/
          retention-days: 30
          if-no-files-found: error
