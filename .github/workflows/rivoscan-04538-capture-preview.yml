name: RivoScan 0.45.38 - capture latest real UI screenshots
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivoscan-04538-capture-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact 0.45.38 release source
        uses: actions/checkout@v4
        with:
          repository: univcours/ribhlab
          ref: d27becbf4dcbcf36344308119d5f1fff529debbf
          path: rivoscan-app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build actual RivoScan 0.45.38 WebView
        shell: bash
        run: |
          set -euo pipefail
          cd rivoscan-app
          node -e 'const p=require("./package.json");if(p.version!=="0.45.38")process.exit(1)'
          npm install --no-audit --no-fund
          npm run build
          npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Capture phone and tablet screenshots from real 0.45.38 UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rivoscan-04538
          cd rivoscan-app
          npm run preview -- --host 127.0.0.1 > /tmp/rivoscan-04538-preview.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          RIVO_PHONE_OUTPUT=/tmp/rivoscan-04538/phone node scripts/phone-play-screenshots.mjs
          RIVO_TABLET_OUTPUT=/tmp/rivoscan-04538/tablet node scripts/tablet-screenshots.mjs
      - name: Validate exact 24 unique screenshots and original interface
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import {readFileSync,readdirSync,statSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const root='/tmp/rivoscan-04538';
          const folders=[['phone/phone',1080,1920],['tablet/7-inch',1080,1920],['tablet/10-inch',1536,2560]];
          const hashes=[];
          for(const [folder,w,h] of folders){
            const dir=root+'/'+folder;
            const files=readdirSync(dir).filter(x=>x.endsWith('.png')).sort();
            if(files.length!==8)throw Error(folder+': expected 8, got '+files.length);
            for(const name of files){
              const b=readFileSync(dir+'/'+name);
              if(b.subarray(0,8).toString('hex')!=='89504e470d0a1a0a'||b.readUInt32BE(16)!==w||b.readUInt32BE(20)!==h||b.length<=10000||b.length>=8000000)throw Error('Invalid capture '+name);
              hashes.push(createHash('sha256').update(b).digest('hex'));
            }
          }
          if(new Set(hashes).size!==24)throw Error('Duplicate UI captures');
          for(const f of ['phone/audit.json','tablet/audit.json']){
            const a=JSON.parse(readFileSync(root+'/'+f,'utf8'));
            if(!a.source.includes('0.45.38')||a.errors.length)throw Error('Capture audit failed '+f);
          }
          console.log('RIVOSCAN_04538_CAPTURE_VERIFIED='+JSON.stringify({version:'0.45.38',phone:8,tablet7:8,tablet10:8,source:'actual WebView UI'}));
          JS
      - name: Save all original screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RivoScan-04538-Actual-WebView-Screenshots-24
          path: /tmp/rivoscan-04538/
          retention-days: 30
          if-no-files-found: error
