name: RivoSticker 1.0.3 production first-release publisher (guarded)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivosticker-first-production.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: google-play-rivosticker-production-release
  cancel-in-progress: false
jobs:
  publish-if-all-play-requirements-passed:
    runs-on: ubuntu-latest
    environment: play-testing
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Verify first release script before accessing Google Play
        run: python -m py_compile tools/play-publisher/rivosticker_first_production.py
      - name: Publish exact original-RivoScan-key AAB versionCode 4 only if all Play checks pass
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" || exit 1
          PYTHONPATH=tools/play-publisher python tools/play-publisher/rivosticker_first_production.py --apply --confirm PUBLISH_RIVOSTICKER_103_ORIGINAL_SIGNED_TO_PRODUCTION
