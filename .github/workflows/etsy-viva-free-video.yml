name: Etsy — Add RibhLab Viva authentic theme preview video
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etsy-viva-free-video.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: etsy-viva-listing-video
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video tools
        run: |
          python -m pip install --disable-pip-version-check 'requests>=2.32,<3' 'Pillow>=11,<13'
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
      - name: Verify Viva media and add one silent preview video if none exists
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          python -m py_compile tools/etsy-publisher/scripts/etsy_viva_free_video.py
          python tools/etsy-publisher/scripts/etsy_viva_free_video.py
