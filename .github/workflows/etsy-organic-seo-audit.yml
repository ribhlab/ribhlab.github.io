name: Etsy — Organic SEO read-only audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etsy-organic-seo-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etsy-organic-seo-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze titles, tags, cover photos and digital files without changing listings
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          python -m py_compile tools/etsy-publisher/scripts/etsy_organic_seo_audit.py
          python tools/etsy-publisher/scripts/etsy_organic_seo_audit.py
