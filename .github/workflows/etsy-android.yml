name: Build RibhLab Etsy Connect Android
on:
  push:
    paths:
      - 'tools/etsy-android/**'
      - '.github/workflows/etsy-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Android debug APK
        working-directory: tools/etsy-android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RibhLab-Etsy-Connect-APK
          path: tools/etsy-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
