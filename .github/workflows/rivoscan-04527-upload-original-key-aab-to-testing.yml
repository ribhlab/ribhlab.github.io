name: RivoScan 0.45.27 - upload signed AAB to current Play test track
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivoscan-04527-upload-original-key-aab-to-testing.yml'
      - 'tools/play-publisher/rivoscan_04527_aab_update.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: google-play-com.ribhlab.rivoscan
  cancel-in-progress: false
jobs:
  deploy-android-update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: play-testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Play API client
        run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Verify ORIGINAL Google Play signed 0.45.27 bundle from official app repo
        run: python tools/play-publisher/rivoscan_04527_aab_update.py
      - name: Publish AAB versionCode 131 to SAME existing beta or closed test track
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
          python tools/play-publisher/rivoscan_04527_aab_update.py \
            --apply --confirm UPLOAD_RIVOSCAN_04527_SIGNED_TO_EXISTING_TEST_TRACK
      - name: Report release boundaries
        if: success()
        run: |
          echo 'RivoScan 0.45.27 AAB versionCode 131 uploaded to the existing test track.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No public Production, icons, screenshots, video, listing text or declarations touched.' >> "$GITHUB_STEP_SUMMARY"
