name: RivoScan 0.45.25 - commit verified YouTube preview to Play
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivoscan-04525-youtube-link-pC1USZxFvbk.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: google-play-com.ribhlab.rivoscan
  cancel-in-progress: false
jobs:
  publish-preview:
    runs-on: ubuntu-latest
    environment: play-testing
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Play API dependencies
        run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Dry-run validation of owner's verified YouTube video
        run: |
          python tools/play-publisher/rivoscan_preview_youtube_link.py \
            --youtube-url 'https://www.youtube.com/watch?v=pC1USZxFvbk'
      - name: Update ONLY RivoScan en-US Play preview video
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" || {
            echo "Google Play service account is unavailable"
            exit 1
          }
          python tools/play-publisher/rivoscan_preview_youtube_link.py \
            --youtube-url 'https://www.youtube.com/watch?v=pC1USZxFvbk' \
            --apply --confirm RIVOSCAN_04525_VIDEO_ONLY
      - name: Report exact authorized scope
        if: success()
        run: |
          echo 'RivoScan versionCode 129: en-US preview video linked to https://youtu.be/pC1USZxFvbk' >> "$GITHUB_STEP_SUMMARY"
          echo 'No APK/AAB, image, icon, feature graphic, release note or track changes.' >> "$GITHUB_STEP_SUMMARY"
