name: Etsy — Replace ProfitLens 3.6 Cover Photo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etsy-profitlens-v36-cover.yml'
      - 'tools/etsy-publisher/scripts/update_profitlens_v36_cover.py'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: etsy-profitlens-v36-cover-replace
  cancel-in-progress: false

jobs:
  replace-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Etsy client
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'
      - name: Verify new source image, replace Etsy cover at rank 1, verify live result
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python -m py_compile tools/etsy-publisher/scripts/update_profitlens_v36_cover.py
          python tools/etsy-publisher/scripts/update_profitlens_v36_cover.py
