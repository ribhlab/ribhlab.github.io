name: RivoSticker 1.0.5 - confirm Google Play review after committed update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rivosticker-v105-post-publish-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rivosticker-v105-readonly-audit
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: play-testing
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install existing verified publisher dependencies
        run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Read-only Google Play Production lifecycle for ONLY RivoSticker
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" || exit 2
          PYTHONPATH=tools/play-publisher python tools/play-publisher/audit_releases.py --package com.ribhlab.rivosticker
