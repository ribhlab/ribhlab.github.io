name: TradingFiew 1.0.4 — standard Google Play production update
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-play-tradingfiew-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: play-testing
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require successful real signed APK and chart QA before changing Play
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            'https://api.github.com/repos/tradingfiew/tradingfiew.github.io/actions/runs/44430897245' \
            > /tmp/tradingfiew-qa.json
          python3 - <<'PY'
          import json
          state=json.load(open('/tmp/tradingfiew-qa.json'))
          if state.get('id') != 44430897245 or state.get('conclusion') != 'success' or state.get('status') != 'completed':
              raise SystemExit('Signed release Android chart QA was not successful; NO Google Play mutation')
          expected='.github/workflows/tradingfiew-real-release-qa.yml'
          if state.get('path') != expected:raise SystemExit('Untrusted workflow result')
          print('Verified actual signed Android launcher and chart runtime regression test success')
          PY
      - name: Fetch exactly verified 1.0.4 APK and AAB, check SHA, cert and real AdMob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tradingfiew-1.0.4
          cd /tmp/tradingfiew-1.0.4
          BASE=https://github.com/univcours/ribhlab/releases/download/tradingfiew-android-v1.0.4
          for NAME in \
            TradingFiew-Android-1.0.4-RivoScanKey-SIGNED.apk \
            TradingFiew-Android-1.0.4-RivoScanKey-SIGNED.aab SHA256SUMS.txt
          do
            curl -fsSL --retry 3 "$BASE/$NAME" -o "$NAME"
          done
          sha256sum --check SHA256SUMS.txt
          APK=TradingFiew-Android-1.0.4-RivoScanKey-SIGNED.apk
          AAB=TradingFiew-Android-1.0.4-RivoScanKey-SIGNED.aab
          jarsigner -verify "$AAB" | grep -F 'jar verified'
          keytool -printcert -jarfile "$AAB" |
            grep -Fi 'SHA1: E9:B3:E2:77:95:75:BA:08:A9:13:72:FC:38:85:EB:A0:1D:D3:E7:3E'
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" |
            grep -F "name='com.ribhlab.tradingfiew' versionCode='5' versionName='1.0.4'"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml |
            grep -F 'ca-app-pub-7945572016731367~1161939707'
      - name: Install official Google Play API client
        run: python3 -m pip install -r tools/play-publisher/requirements.txt
      - name: Atomic regular Production update (no marketing changes)
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}"
          python3 tools/play-publisher/tradingfiew_v5_production_update.py \
            --aab /tmp/tradingfiew-1.0.4/TradingFiew-Android-1.0.4-RivoScanKey-SIGNED.aab \
            --apply --confirm PUBLISH_TRADINGFIEW_5
      - name: Independently audit committed Google Play state
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: PYTHONPATH=tools/play-publisher python3 tools/play-publisher/tradingfiew_play_audit.py
