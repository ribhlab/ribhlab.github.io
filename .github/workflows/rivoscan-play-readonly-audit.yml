name: RivoScan - read only Play release and screenshots audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivoscan-play-readonly-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: play-testing
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Read Play tracks and media, never commit an edit
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" || exit 1
          python tools/play-publisher/rivoscan_play_readonly_audit.py
