name: RivoCaption 0.3.4 - localized Play Store descriptions
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivocaption-localizations.yml'
      - 'tools/play-publisher/rivocaption_localizations.py'
      - 'tools/play-publisher/store-listings/rivocaption-locales-2026-11-24.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: google-play-rivocaption-real-media
  cancel-in-progress: false
jobs:
  save-7-localizations:
    runs-on: ubuntu-latest
    environment: play-testing
    timeout-minutes: 20
    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      PYTHONPATH: tools/play-publisher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Play SDK
        run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Validate translations
        run: python tools/play-publisher/rivocaption_localizations.py
      - name: Commit 7 RivoCaption localized store descriptions
        run: |
          python tools/play-publisher/rivocaption_localizations.py --apply --confirm LOCALIZE_RIVOCAPTION_EXISTING_PLAY_LISTING
          echo 'Seven localizations saved. No release, country or image edits.' >> "$GITHUB_STEP_SUMMARY"
