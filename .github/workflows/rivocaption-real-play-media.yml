name: RivoCaption 0.3.4 - genuine Android screenshots and official Google Play art
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivocaption-real-play-media.yml'
      - 'tools/play-publisher/rivocaption_real_media.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: google-play-rivocaption-real-media
  cancel-in-progress: false
jobs:
  real-rivocaption-capture:
    runs-on: ubuntu-24.04
    environment: play-testing
    timeout-minutes: 55
    env:
      PYTHONPATH: tools/play-publisher
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Google Play Python SDK and art dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tools/play-publisher/requirements.txt 'Pillow>=11,<13' 'CairoSVG>=2.8,<3'
          python -m py_compile tools/play-publisher/rivocaption_real_media.py
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
      - name: Retrieve exact original-key-signed release APK and validate SHA256
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://github.com/univcours/ribhlab/releases/download/rivocaption-v0.3.4-original-rivoscan'
          curl -fLsS --retry 5 --connect-timeout 35 "$BASE/RivoCaption-0.3.4-RivoScan-SIGNED.apk" -o /tmp/rivocaption-034.apk
          curl -fLsS --retry 5 --connect-timeout 35 "$BASE/SHA256SUMS.txt" -o /tmp/rivocaption-sums
          sed -n '/SIGNED.apk/p' /tmp/rivocaption-sums | sed 's@RivoCaption-0.3.4-RivoScan-SIGNED.apk@/tmp/rivocaption-034.apk@' | sha256sum -c -
      - name: Enable hardware acceleration for real Android emulator
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Boot Android, capture REAL RivoCaption screens, upload validated art to Google Play
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 3072M
          disk-size: 2048M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 2048 -no-metrics
          disable-animations: true
          script: |
            python tools/play-publisher/rivocaption_real_media.py --apk /tmp/rivocaption-034.apk --output /tmp/rivocaption-real --publish
      - name: Preserve genuine Android screenshots and GUI hierarchy for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RivoCaption-0.3.4-Genuine-Android-Play-Art
          path: /tmp/rivocaption-real/
          if-no-files-found: warn
          retention-days: 30
