name: RivoScan 0.45.40 - capture installed Android APK UI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivoscan-04540-native-android-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download signed exact RivoScan 0.45.40 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rivo-04540-native/screens
          curl -fL --retry 3 --retry-delay 3 \
            -o /tmp/rivo-04540-native/app.apk \
            https://github.com/univcours/ribhlab/releases/download/rivoscan-0.45.40-original-key/RivoScan-0.45.40-Signed.apk
          test "$(stat -c%s /tmp/rivo-04540-native/app.apk)" -gt 80000000
          unzip -tq /tmp/rivo-04540-native/app.apk | tail -1
      - name: Boot emulator, install APK, navigate app, capture Android screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            adb shell wm size 720x1280
            adb shell wm density 320
            adb shell input keyevent KEYCODE_HOME
            sleep 20
            adb shell am force-stop com.android.settings || true
            adb shell input keyevent KEYCODE_HOME
            adb install -r /tmp/rivo-04540-native/app.apk
            adb shell pm list packages | grep -F 'com.ribhlab.rivoscan'
            adb shell am force-stop com.ribhlab.rivoscan || true
            adb shell monkey -p com.ribhlab.rivoscan -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell input keyevent KEYCODE_BACK || true
            sleep 3
            adb shell screencap -p /sdcard/rivo_home.png
            adb pull /sdcard/rivo_home.png /tmp/rivo-04540-native/screens/01_Home.png
            adb shell uiautomator dump /sdcard/rivo_home.xml || true
            adb pull /sdcard/rivo_home.xml /tmp/rivo-04540-native/home.xml || true
            adb shell input tap 180 1200
            sleep 5
            adb shell screencap -p /sdcard/rivo_documents.png
            adb pull /sdcard/rivo_documents.png /tmp/rivo-04540-native/screens/02_Documents.png
            adb shell input tap 520 1200
            sleep 5
            adb shell screencap -p /sdcard/rivo_tools.png
            adb pull /sdcard/rivo_tools.png /tmp/rivo-04540-native/screens/03_Tools.png
            adb shell input tap 650 1200
            sleep 5
            adb shell screencap -p /sdcard/rivo_settings.png
            adb pull /sdcard/rivo_settings.png /tmp/rivo-04540-native/screens/08_Settings.png
            adb shell dumpsys activity activities > /tmp/rivo-04540-native/activity.txt || true
      - name: Detect ANR, blank, duplicate or system dialog screens
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageStat
          import hashlib,json
          root=Path('/tmp/rivo-04540-native')
          shots=sorted((root/'screens').glob('*.png'))
          record={'version':'0.45.40','source':'Installed signed APK in Android emulator','files':[]}
          for p in shots:
              with Image.open(p) as im:
                  record['files'].append({'name':p.name,'size':im.size,'bytes':p.stat().st_size,
                    'stddev':round(sum(ImageStat.Stat(im.convert('RGB')).stddev)/3,1),
                    'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          xml=(root/'home.xml').read_text(errors='ignore') if (root/'home.xml').exists() else ''
          record['anrDialogDetected']=any(t in xml.lower() for t in ('isn&#39;t responding','isn\'t responding','not responding','close app'))
          record['validScreens']=len(shots)==4 and not record['anrDialogDetected'] and all(x['stddev']>20 for x in record['files'])
          (root/'audit.json').write_text(json.dumps(record,indent=2))
          print('RIVOSCAN_04540_NATIVE_CAPTURE_AUDIT='+json.dumps(record),flush=True)
          PY
        continue-on-error: true
      - name: Upload actual Android screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RivoScan-04540-Installed-APK-Original-Screenshots
          path: /tmp/rivo-04540-native/
          retention-days: 30
          if-no-files-found: warn
