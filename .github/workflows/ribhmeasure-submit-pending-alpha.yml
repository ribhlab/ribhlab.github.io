name: RivoMeasure 1.3.9 - safely submit saved Closed Alpha changes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ribhmeasure-submit-pending-alpha.yml']
  workflow_dispatch:
    inputs:
      confirm:
        description: Type SEND_RIVOMEASURE_ALPHA_13
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: google-play-com-ribhlab-ribhmeasure-alpha-submit
  cancel-in-progress: false
jobs:
  submit-saved-alpha-only:
    runs-on: ubuntu-latest
    environment: play-testing
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Confirm exact package/version and offline protections
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover tools/play-publisher -p 'test_ribhmeasure_submit_pending_alpha.py' -v
          python -m compileall -q tools/play-publisher/ribhmeasure_submit_pending_alpha.py
      - name: Validate one-time authorization for manual starts
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$CONFIRM" = "SEND_RIVOMEASURE_ALPHA_13" || {
            echo "BLOCKED: invalid Alpha submission confirmation"
            exit 1
          }
      - name: Install official Google Play API dependencies
        run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Read-only live Production and Alpha release status
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}"
          python tools/play-publisher/ribhmeasure_submit_pending_alpha.py
      - name: Submit ONLY existing saved Alpha changes, never cancel review
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python tools/play-publisher/ribhmeasure_submit_pending_alpha.py \
            --apply --confirm SEND_RIVOMEASURE_ALPHA_13
      - name: Read back the release lifecycle, never assume approval
        if: always()
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]]; then
            python tools/play-publisher/audit_releases.py --package com.ribhlab.ribhmeasure
          fi
