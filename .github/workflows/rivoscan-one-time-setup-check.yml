name: RivoScan Play Console - one-time read-only setup check
on:
  push:
    branches:
      - audit/rivoscan-play-setup-20261106
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Check live RivoScan track visibility without any Google Play edit
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: python tools/play-publisher/audit_releases.py --package com.ribhlab.rivoscan
