name: Etsy Publisher — tests
on:
  push:
    paths:
      - 'tools/etsy-publisher/**'
      - '.github/workflows/etsy-publisher-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r tools/etsy-publisher/requirements.txt pytest
      - name: Run publisher tests
        working-directory: tools/etsy-publisher
        run: python -m pytest -q
