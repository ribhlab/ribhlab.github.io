name: Google Play - RibhLab safe read-only status audit (3 apps)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ribhlab-play-safe-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play-release-audit:
    name: Read official Google Play release status without edits
    runs-on: ubuntu-latest
    environment: play-testing
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Google API clients
        run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Safely read release statuses for three apps
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          if [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo 'GOOGLE_PLAY_CREDENTIAL_MISSING'
            exit 1
          fi
          # Pure GET operations; no Play edits, uploads, commit or publish.
          for app in com.ribhlab.rivoscan com.ribhlab.tradingfiew com.novagrid.cosmicpuzzle; do
            echo "=== BEGIN AUDIT: $app ==="
            python tools/play-publisher/audit_releases.py --package "$app" || true
            echo "=== END AUDIT: $app ==="
          done
