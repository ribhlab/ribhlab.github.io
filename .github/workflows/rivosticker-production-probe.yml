name: RivoSticker 1.0.3 production readiness (no rollout)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivosticker-production-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: google-play-rivosticker-production-probe
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: play-testing
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Validate draft-production conversion inside discarded Play edit only
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" || exit 1
          python -m py_compile tools/play-publisher/rivosticker_production_probe.py
          PYTHONPATH=tools/play-publisher python tools/play-publisher/rivosticker_production_probe.py
