name: Publish RibhLab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresh publicly attributed Market Pulse feeds every five hours.
  # GitHub schedules are best effort, not guaranteed exact execution times.
  schedule:
    - cron: '0 */5 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh news headlines from attributed RSS sources
        run: node src/update-news.mjs
      - name: Vendor pinned PDF and QR libraries locally
        run: |
          set -euo pipefail
          mkdir -p public/rivoscan/tools/vendor
          npm install --prefix /tmp/rivo-web-vendor --no-audit --no-fund pdf-lib@1.17.1 qrcode@1.5.4 esbuild@0.25.12
          cp /tmp/rivo-web-vendor/node_modules/pdf-lib/dist/pdf-lib.min.js public/rivoscan/tools/vendor/
          /tmp/rivo-web-vendor/node_modules/.bin/esbuild /tmp/rivo-web-vendor/node_modules/qrcode/lib/browser.js --bundle --minify --global-name=QRCode --outfile=public/rivoscan/tools/vendor/qrcode.min.js
          find /tmp/rivo-web-vendor/node_modules/pdf-lib -maxdepth 1 -iname 'license*' -exec cp {} public/rivoscan/tools/vendor/PDF-LIB-LICENSE.txt \;
          find /tmp/rivo-web-vendor/node_modules/qrcode -maxdepth 1 -iname 'license*' -exec cp {} public/rivoscan/tools/vendor/QRCODE-LICENSE.txt \;
          node --check public/rivoscan/tools/tool.js
      - name: Build pages (Arabic, English, French)
        # Original repo keeps /ribhlab-site; an imported OWNER/OWNER.github.io site
        # uses its own root, including ribhlab/ribhlab.github.io if created.
        # Override with RIBHLAB_SITE_URL only for a verified custom domain.
        env:
          SITE_URL: ${{ vars.RIBHLAB_SITE_URL || (github.event.repository.name == format('{0}.github.io', github.repository_owner) && format('https://{0}.github.io', github.repository_owner) || 'https://univcours.github.io/ribhlab-site') }}
          CONTACT_EMAIL: ${{ vars.RIBHLAB_CONTACT_EMAIL || '' }}
          # Publisher identity is read from site.config.json to prevent stale Actions variables overriding it.
          # AdSense activation is controlled by site.config.json; do not override it with a stale environment variable.
          GOOGLE_SITE_VERIFICATION: ${{ vars.RIBHLAB_GOOGLE_SITE_VERIFICATION || '' }}
          UMAMI_WEBSITE_ID: ${{ vars.RIBHLAB_UMAMI_WEBSITE_ID || '' }}
          AUDIENCE_SHARE_URL: ${{ vars.RIBHLAB_UMAMI_SHARE_URL || '' }}
        run: |
          npm run build
          npm run check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
