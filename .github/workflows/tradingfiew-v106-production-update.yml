name: TradingFiew 1.0.6 — verified Google Play Production update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tradingfiew-v106-production-update.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-play-tradingfiew-production
  cancel-in-progress: false

jobs:
  production-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: play-testing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require exact ORIGINAL-KEY signed Android emulator QA success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/univcours/ribhlab/actions/runs/44627733655' > /tmp/tradingfiew-106-qa.json
          python3 - <<'PY'
          import json
          run=json.load(open('/tmp/tradingfiew-106-qa.json'))
          if (run.get('id') != 44627733655
              or run.get('status') != 'completed'
              or run.get('conclusion') != 'success'
              or run.get('path') != '.github/workflows/tradingfiew-v106-certified-release.yml'
              or run.get('head_sha') != 'eccb5f53ba5918b60616e04cf39c1e5479fa1b26'):
              raise SystemExit('Signed TradingFiew 1.0.6 emulator QA is not confirmed. Refusing Play changes.')
          print('Confirmed exact signed version 1.0.6 Android launch QA and release')
          PY
      - name: Download independently verified original-key Android release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tradingfiew-1.0.6
          cd /tmp/tradingfiew-1.0.6
          BASE=https://github.com/univcours/ribhlab/releases/download/tradingfiew-android-v1.0.6
          for NAME in TradingFiew-Android-1.0.6-RivoScanKey-SIGNED.aab TradingFiew-Android-1.0.6-RivoScanKey-SIGNED.apk SHA256SUMS.txt; do
            curl -fsSL --retry 3 "$BASE/$NAME" -o "$NAME"
          done
          sha256sum -c SHA256SUMS.txt
          APK=TradingFiew-Android-1.0.6-RivoScanKey-SIGNED.apk
          AAB=TradingFiew-Android-1.0.6-RivoScanKey-SIGNED.aab
          jarsigner -verify "$AAB" | grep -F 'jar verified'
          keytool -printcert -jarfile "$AAB" | grep -Fi 'SHA1: E9:B3:E2:77:95:75:BA:08:A9:13:72:FC:38:85:EB:A0:1D:D3:E7:3E'
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -F "name='com.ribhlab.tradingfiew' versionCode='7' versionName='1.0.6'"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F 'ca-app-pub-7945572016731367~1161939707'
          echo 'Verified exact signed 1.0.6/Code 7, AdMob APP ID, RivoScan signer and release checksums' >> "$GITHUB_STEP_SUMMARY"
      - name: Install official Android Publisher API client
        run: python3 -m pip install -r tools/play-publisher/requirements.txt
      - name: Upload signed AAB versionCode 7 and commit only to TradingFiew Production
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}"
          python3 tools/play-publisher/tradingfiew_v7_production_update.py \
            --aab /tmp/tradingfiew-1.0.6/TradingFiew-Android-1.0.6-RivoScanKey-SIGNED.aab \
            --apply --confirm PUBLISH_TRADINGFIEW_7
      - name: Verify committed Production status inside Google Play independently
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools/play-publisher python3 tools/play-publisher/tradingfiew_play_audit.py
