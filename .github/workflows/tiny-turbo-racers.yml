name: Tiny Turbo Racers Android Debug APK
on:
  push:
    branches: [tiny-turbo-racers-v01]
    paths:
      - "games/tiny-turbo-racers/**"
      - ".github/workflows/tiny-turbo-racers.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36 (hosted runner SDK)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Generate official Gradle wrapper
        run: gradle -p games/tiny-turbo-racers wrapper --gradle-version 8.13
      - name: Build APK
        run: gradle --no-daemon -p games/tiny-turbo-racers :app:assembleDebug
      - name: Upload ready-to-install APK
        uses: actions/upload-artifact@v4
        with:
          name: tiny-turbo-racers-debug-apk
          path: games/tiny-turbo-racers/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Save official wrapper into game branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/tiny-turbo-racers/gradlew games/tiny-turbo-racers/gradlew.bat games/tiny-turbo-racers/gradle/wrapper/gradle-wrapper.jar
          if ! git diff --cached --quiet; then
            git commit -m "Add official Gradle wrapper for Tiny Turbo Racers"
            git push origin HEAD:tiny-turbo-racers-v01
          fi
