name: Etsy — Free cross-promote all 4 products
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etsy-free-cross-promotion.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etsy-internal-cross-promotion
  cancel-in-progress: false

jobs:
  crosslink:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add related Etsy product links to verified seller descriptions without paid actions
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          python -m py_compile tools/etsy-publisher/scripts/etsy_internal_cross_promotion.py
          python tools/etsy-publisher/scripts/etsy_internal_cross_promotion.py
