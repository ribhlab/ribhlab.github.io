name: Build RibhMeasure Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/downloads/RibhMeasure-Android-Source-v1.0.0.zip'
      - '.github/workflows/ribhmeasure-android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Extract RibhMeasure sources
        run: unzip -q public/downloads/RibhMeasure-Android-Source-v1.0.0.zip -d "${RUNNER_TEMP}"
      - name: Build and test APK
        working-directory: ${{ runner.temp }}/RibhMeasure
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RibhMeasure-debug-apk
          path: ${{ runner.temp }}/RibhMeasure/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
