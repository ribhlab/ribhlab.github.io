name: RivoCaption REAL Android Foreground DATA_SYNC permission demo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivocaption-fgs-demo.yml'
      - 'tools/play-publisher/rivocaption_fgs_real_demo.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rivocaption-real-fgs-video
  cancel-in-progress: false
jobs:
  record-foreground-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and validate original RivoScan-signed RivoCaption APK
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://github.com/univcours/ribhlab/releases/download/rivocaption-v0.3.4-original-rivoscan'
          curl -fLsS --retry 5 "$BASE/RivoCaption-0.3.4-RivoScan-SIGNED.apk" -o /tmp/rivocaption-034.apk
          curl -fLsS --retry 5 "$BASE/SHA256SUMS.txt" -o /tmp/rivocaption-sums
          sed -n '/SIGNED.apk/p' /tmp/rivocaption-sums | sed 's@RivoCaption-0.3.4-RivoScan-SIGNED.apk@/tmp/rivocaption-034.apk@' | sha256sum -c -
          python -m py_compile tools/play-publisher/rivocaption_fgs_real_demo.py
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Enable KVM acceleration
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL
      - name: Genuine signed app and user-initiated background model-download demonstration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 3072M
          disk-size: 2048M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 2048 -no-metrics
          disable-animations: true
          script: |
            PYTHONPATH=tools/play-publisher python tools/play-publisher/rivocaption_fgs_real_demo.py
      - name: Upload genuine recording and Android UI hierarchy for validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RivoCaption-REAL-FGS-DATASYNC-Video-For-Google-Policy
          path: /tmp/rivocaption-fgs-demo/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish real Android screen recording for Google's reviewer
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rivocaption-fgs-data-sync-review-demo-v0.3.4
          name: RivoCaption 0.3.4 real foreground-service demonstration
          prerelease: true
          body: 'Authentic Android recording from original-key-signed RivoCaption 0.3.4. Shows user-initiated offline speech model download, visible ongoing Android notification and background continuation. Evidence for Google Play FOREGROUND_SERVICE_DATA_SYNC permission review.'
          files: /tmp/rivocaption-fgs-demo/RivoCaption-FGS-DataSync-Demo.mp4
