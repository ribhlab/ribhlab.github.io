name: Publish verified TradingFiew APK
on:
  push:
    branches:
      - distribution/tradingfiew-1.0.10
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify file checksum
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create tradingfiew-1.0.10-standalone \
            TradingFiew-1.0.10-SIGNED.apk \
            SHA256SUMS.txt \
            --target main \
            --title 'TradingFiew 1.0.10 - Verified Standalone APK' \
            --notes-file RELEASE_NOTES.md \
            --latest=false
