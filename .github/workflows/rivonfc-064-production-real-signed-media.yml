name: RivoNFC 0.6.4 - code11 original-signed Production and genuine store screenshots
on:
  workflow_dispatch:
    inputs:
      ads_declared:
        description: 'I checked RivoNFC Google Play Console > App content > Ads; Contains ads = Yes is saved'
        type: boolean
        default: false
        required: true
      data_safety_declared:
        description: 'I checked and submitted accurate RivoNFC Data safety answers for Mobile Ads SDK 25.5 + UMP 4.0'
        type: boolean
        default: false
        required: true
      ad_id_declared:
        description: 'I updated RivoNFC Play Console Advertising ID declaration to YES for the Google Mobile Ads SDK'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: google-play-com.ribhlab.rivonfc
  cancel-in-progress: false
jobs:
  production-only-after-real-console-forms:
    if: ${{ inputs.ads_declared == true && inputs.data_safety_declared == true && inputs.ad_id_declared == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    environment: play-production
    env:
      PYTHONPATH: tools/play-publisher
      GH_TOKEN: ${{ github.token }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      RIVONFC_064_ADS_CONSOLE_VERIFIED: 'true'
      RIVONFC_064_DATA_SAFETY_CONSOLE_VERIFIED: 'true'
      RIVONFC_064_AD_ID_CONSOLE_VERIFIED: 'true'
      RIVONFC_064_COMPLIANCE_APPROVAL: RIVONFC_064_PLAY_ADS_DATASAFETY_VERIFIED
      SCREEN_QA_RUN: '46076130056'
      SCREEN_QA_COMMIT: 95643983a485b2cac389c4af810bc74eadaa23ec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install official publisher and verify guarded code11 in isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}"
          python3 -m pip install -r tools/play-publisher/requirements.txt 'Pillow>=11,<13' requests
          python3 -m unittest discover tools/play-publisher -p 'test_rivonfc_064_promote.py' -v
          python3 -m py_compile tools/play-publisher/rivonfc_064_production_real_media.py
          grep -Fq 'changesInReviewBehavior="ERROR_IF_IN_REVIEW"' tools/play-publisher/rivonfc_064_production_real_media.py
      - name: Require complete real signed APK screen capture with pinned GitHub Actions provenance
        shell: bash
        run: |
          set -euo pipefail
          result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SCREEN_QA_RUN" --jq '.conclusion')"
          source="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SCREEN_QA_RUN" --jq '.head_sha')"
          test "$result" = success
          test "$source" = "$SCREEN_QA_COMMIT"
          mkdir -p rivonfc-code11-store
          gh run download "$SCREEN_QA_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name RivoNFC-064-Code11-OriginalSigned-Genuine-StoreMedia \
            --dir rivonfc-code11-store
          (cd rivonfc-code11-store && sha256sum -c SHA256SUMS.txt)
          echo 'RIVONFC_064_REAL_CODE11_PNG_SET=VERIFIED' >> "$GITHUB_STEP_SUMMARY"
      - name: Promote only original signed, Play-staged code11 Production with real code11 photos
        shell: bash
        run: |
          set -euo pipefail
          python3 -u tools/play-publisher/rivonfc_064_production_real_media.py
      - name: Independent read-only Google Play audit of Production after safe commit
        if: always()
        shell: bash
        run: |
          if [[ -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]]; then
            python3 tools/play-publisher/audit_releases.py --package com.ribhlab.rivonfc
          fi
      - name: No false public availability claims
        run: |
          echo 'RivoNFC Production code11 and 4 authenticated code11 screenshots submitted. Google approval is verified via release lifecycle separately. Internal code9 and original icon/feature graphic preserved.' >> "$GITHUB_STEP_SUMMARY"
