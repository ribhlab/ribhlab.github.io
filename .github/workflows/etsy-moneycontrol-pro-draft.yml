name: Etsy MoneyControl Pro - secure draft upload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etsy-moneycontrol-pro-draft.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moneycontrol-etsy-draft-single-writer
  cancel-in-progress: false

jobs:
  moneycontrol-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source only (no buyer assets in Git)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify publisher script
        run: python -m py_compile tools/etsy-publisher/scripts/publish_moneycontrol_pro_draft.py
      - name: Install Etsy HTTPS client
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'
      - name: Create or complete Etsy draft with verified PDF and cover
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: python tools/etsy-publisher/scripts/publish_moneycontrol_pro_draft.py
      - name: Final safety notice
        if: always()
        run: echo "MoneyControl remains DRAFT. Do not activate before Google Sheets copy URL is public Viewer."
