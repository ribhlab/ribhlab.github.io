name: RibhLab eligible apps - isolated Play read-only audit
on:
  push:
    branches:
      - audit/play-ads-targets-readonly-20261127
    paths:
      - .github/workflows/ads-targets-play-readonly-audit-20261127.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-eligible-app:
    name: Read-only Play state (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        package:
          - com.ribhlab.rivotalk
          - com.ribhlab.rivonfc
          - com.rivocaption.editor
          - com.ribhlab.rivosticker
          - com.ribhlab.ribhmeasure
          - com.ribhlab.tradingfiew
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original publisher's Google API dependencies
        run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Audit existing package tracks without Play edits or uploads
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE: ${{ matrix.package }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PACKAGE" in
            com.ribhlab.rivoscan|com.novagrid.cosmicpuzzle) echo "::error::Excluded app" ; exit 1 ;;
          esac
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" || {
            echo 'Google Play service account unavailable on this workflow'; exit 1;
          }
          python tools/play-publisher/audit_releases.py --package "$PACKAGE"
