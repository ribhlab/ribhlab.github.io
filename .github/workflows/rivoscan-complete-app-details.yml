name: RivoScan - complete Play Store app details
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivoscan-complete-app-details.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-play-com.ribhlab.rivoscan
  cancel-in-progress: false

jobs:
  app-details:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: play-testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test strict metadata scope
        run: python -m unittest discover tools/play-publisher -p 'test_rivoscan_complete_app_details.py' -v
      - name: Install official Google Play client
        run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Save verified RivoScan app details via Android Publisher API
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" || {
            echo 'Google Play API credentials missing; no changes made.'; exit 1;
          }
          python tools/play-publisher/rivoscan_complete_app_details.py
      - name: Note unsupported policy forms
        if: always()
        run: |
          {
            echo '### RivoScan Google Play app details'
            echo '- Changes only English default language, public support email and site.'
            echo '- Does not submit IARC, target audience, restricted access or Ads declarations.'
            echo '- Those policy questionnaires require Google Play Console UI.'
          } >> "$GITHUB_STEP_SUMMARY"
