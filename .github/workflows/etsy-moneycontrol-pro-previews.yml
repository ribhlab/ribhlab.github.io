name: Etsy MoneyControl - add 3 extra preview images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etsy-moneycontrol-pro-previews.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moneycontrol-etsy-extra-previews
  cancel-in-progress: false

jobs:
  add-preview-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'
      - name: Upload three preview images and verify all four
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: python tools/etsy-publisher/scripts/add_moneycontrol_previews.py
