name: RivoNFC 0.6.4 - Internal Testing only after genuine Production release is reviewed
on:
  workflow_dispatch:
    inputs:
      ads_declared:
        description: "Google Play Console Contains ads = Yes, reviewed and saved for RivoNFC"
        type: boolean
        default: false
        required: true
      data_safety_declared:
        description: "Google Play Console Data safety updated for Google Mobile Ads SDK / UMP and submitted"
        type: boolean
        default: false
        required: true
      ad_id_declared:
        description: "Google Play Console Advertising ID use confirmed YES for RivoNFC Mobile Ads SDK"
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: google-play-com.ribhlab.rivonfc
  cancel-in-progress: false
jobs:
  promote-internal-only:
    if: ${{ inputs.ads_declared == true && inputs.data_safety_declared == true && inputs.ad_id_declared == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: play-testing
    env:
      RIVONFC_064_COMPLIANCE_APPROVAL: RIVONFC_064_PLAY_ADS_DATASAFETY_VERIFIED
      RIVONFC_064_AD_ID_CONSOLE_VERIFIED: 'true'
      PYTHONPATH: tools/play-publisher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify guarded publisher and official credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}"
          python -m py_compile tools/play-publisher/rivonfc_064_promote.py
          python -m pip install -r tools/play-publisher/requirements.txt
      - name: Only after actual code11 Production is reviewed, promote same code11 to Internal Testing
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: python tools/play-publisher/rivonfc_064_promote.py --phase internal
      - name: Verify promotion receipt
        run: echo 'RivoNFC code11 Internal Testing edit submitted after a genuine signed-code11 Production release. This workflow never changes Production, images or app declarations.' >> "$GITHUB_STEP_SUMMARY"
