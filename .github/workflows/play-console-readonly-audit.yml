name: Google Play Console - read-only release audit

on:
  workflow_dispatch:
    inputs:
      app_package:
        description: 'Select app to inspect (read-only, no upload or edits)'
        required: true
        type: choice
        options:
          - com.novagrid.cosmicpuzzle
          - com.ribhlab.rivoscan
        default: com.novagrid.cosmicpuzzle

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Google API clients
        run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Run offline publisher and audit tests
        run: python -m unittest discover tools/play-publisher -p 'test_*.py' -v
      - name: Read Play release states without editing anything
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE: ${{ inputs.app_package }}
        run: |
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" || { echo 'Missing service account secret'; exit 1; }
          python tools/play-publisher/audit_releases.py --package "$PACKAGE"
