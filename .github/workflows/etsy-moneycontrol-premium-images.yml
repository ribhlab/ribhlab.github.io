name: Etsy MoneyControl - Premium 4 Image Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etsy-moneycontrol-premium-images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etsy-moneycontrol-premium-image-update
  cancel-in-progress: false

jobs:
  update-listing-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python script
        run: python -m py_compile tools/etsy-publisher/scripts/update_moneycontrol_premium_images.py
      - run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'
      - name: Safely upload new premium photos to the existing active listing
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: python tools/etsy-publisher/scripts/update_moneycontrol_premium_images.py
