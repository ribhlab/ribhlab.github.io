name: RibhLab Midnight Rush GT v0.8 — Trees, Race Modes, Wheel, Audio
on:
  push:
    branches: [tiny-turbo-racing-dev-v08]
    paths:
      - "games/tiny-turbo-racers-godot/**"
      - ".github/workflows/tiny-turbo-godot.yml"
  workflow_dispatch:
concurrency:
  group: "tiny-turbo-dev-${{ github.ref_name }}"
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate-godot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Godot 4.7.2 (standard, not .NET)
        run: |
          curl -fL --retry 3 --connect-timeout 20 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o /tmp/godot-linux.zip
          unzip -q /tmp/godot-linux.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Import and parse every Godot script and scene
        shell: bash
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor \
            --path games/tiny-turbo-racers-godot --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script|ERROR: Error importing' /tmp/godot-import.log; then
            echo "GDScript parse errors detected!"
            exit 1
          fi
      - name: Native project startup smoke test
        shell: bash
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path games/tiny-turbo-racers-godot --quit-after 90 \
            2>&1 | tee /tmp/godot-run.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' /tmp/godot-run.log; then
            echo "Runtime script errors detected!"
            exit 1
          fi
      - name: Complete 3-lap gameplay smoke test
        shell: bash
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path games/tiny-turbo-racers-godot \
            --script res://ci/playtest.gd 2>&1 | tee /tmp/godot-playtest.log
          grep 'TINY_TURBO_GODOT_PLAYTEST_PASS' /tmp/godot-playtest.log
      - name: Test Midnight Rush traffic, neon city, Nitro and Drift
        shell: bash
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path games/tiny-turbo-racers-godot \
            --script res://ci/midnight_test.gd 2>&1 | tee /tmp/midnight-test.log
          grep 'MIDNIGHT_RUSH_PLAYTEST_PASS' /tmp/midnight-test.log
      - name: Simulate car braking, real drift, 5-finger touch, background pause, garage and replay
        shell: bash
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path games/tiny-turbo-racers-godot \
            --script res://ci/handling_test.gd 2>&1 | tee /tmp/godot-handling-test.log
          grep 'TINY_TURBO_HANDLING_TOUCH_REPLAY_PASS' /tmp/godot-handling-test.log
      - name: Verify real Low Medium High graphics settings and restore
        shell: bash
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path games/tiny-turbo-racers-godot \
            --script res://ci/graphics_test.gd 2>&1 | tee /tmp/godot-graphics-test.log
          grep 'TINY_TURBO_GRAPHICS_PRESET_PASS' /tmp/godot-graphics-test.log
      - name: Validate six real GT car models and garage switching
        shell: bash
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path games/tiny-turbo-racers-godot \
            --script res://ci/brand_test.gd 2>&1 | tee /tmp/godot-brand-test.log
          grep 'TINY_TURBO_BRANDS_PASS' /tmp/godot-brand-test.log
      - name: Validate real trees, 3 distinct maps, recorded engines and race modes
        shell: bash
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path games/tiny-turbo-racers-godot \
            --script res://ci/v08_racing_test.gd 2>&1 | tee /tmp/godot-v08-test.log
          grep 'TINY_TURBO_V08_TRACKS_TREES_AUDIO_RACES_PASS' /tmp/godot-v08-test.log
      - name: Verify Jolt, PBR road, clearcoat, dust, and native vegetation instancing
        shell: bash
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path games/tiny-turbo-racers-godot \
            --script res://ci/realism_test.gd 2>&1 | tee /tmp/godot-quality.log
          grep 'TINY_TURBO_REALISM_TEST_PASS' /tmp/godot-quality.log
      - name: Verify editor has actual 3D track and visible cars
        shell: bash
        env:
          TINY_TURBO_EDITOR_PREVIEW_TEST: "1"
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor \
            --path games/tiny-turbo-racers-godot \
            --script res://ci/editor_preview_test.gd 2>&1 | tee /tmp/godot-editor-preview.log
          grep 'TINY_TURBO_EDITOR_PREVIEW_PASS' /tmp/godot-editor-preview.log
      - name: Render a real 3D screenshot of the new circuit (best effort)
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          command -v xvfb-run || exit 0
          xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --rendering-method gl_compatibility \
            --path games/tiny-turbo-racers-godot \
            --script res://ci/capture_real_scene.gd 2>&1 | tee /tmp/godot-real-screenshot.log
      - name: Upload real circuit screenshot
        uses: actions/upload-artifact@v4
        with:
          name: tiny-turbo-v08-real-gameplay-frame
          path: games/tiny-turbo-racers-godot/build/real_circuit_frame.png
          if-no-files-found: ignore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK tools for Godot
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "build-tools;35.0.1" "platforms;android-35"
      - name: Download official matching Android export templates
        run: |
          curl -fL --retry 3 --connect-timeout 30 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz \
            -o /tmp/godot-templates.tpz
          DEST="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$DEST"
          unzip -p /tmp/godot-templates.tpz templates/android_debug.apk > "$DEST/android_debug.apk"
          unzip -p /tmp/godot-templates.tpz templates/android_release.apk > "$DEST/android_release.apk"
          printf '4.7.2.stable\n' > "$DEST/version.txt"
          test -s "$DEST/android_debug.apk"
      - name: Configure Android SDK and debug signing
        shell: bash
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Tiny Turbo Dev, OU=Debug, O=RibhLab, C=MA"
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor \
            --path games/tiny-turbo-racers-godot \
            --script res://ci/configure_android.gd
      - name: Build Godot 3D Android debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p games/tiny-turbo-racers-godot/build
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path games/tiny-turbo-racers-godot \
            --export-debug Android build/TinyTurboRacers3D-debug.apk 2>&1 | tee /tmp/godot-android-export.log
          test -s games/tiny-turbo-racers-godot/build/TinyTurboRacers3D-debug.apk
          ls -lh games/tiny-turbo-racers-godot/build/TinyTurboRacers3D-debug.apk
      - name: Share Godot 3D APK
        uses: actions/upload-artifact@v4
        with:
          name: tiny-turbo-v08-debug-apk
          path: games/tiny-turbo-racers-godot/build/TinyTurboRacers3D-debug.apk
          if-no-files-found: error
