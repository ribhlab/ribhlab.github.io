name: RivoScan - closed test and production draft preparation
on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivoscan-closed-production-preparation.yml'
      - 'tools/play-publisher/rivoscan_stage_closed_and_production.py'

permissions:
  contents: read

concurrency:
  group: google-play-com.ribhlab.rivoscan
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This is strictly CLOSED testing plus a NON-PUBLIC production draft.
    # Google Play's account, signing and tester requirements remain mandatory.
    environment: play-testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run safety tests before any Google Play edit
        run: python -m unittest discover tools/play-publisher -p 'test_*.py' -q
      - name: Install official Google Play client
        run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Check saved RivoScan release and prepare eligible tracks
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" || {
            echo 'Google Play service-account credential is unavailable'; exit 1;
          }
          python tools/play-publisher/rivoscan_stage_closed_and_production.py \
            --apply --confirm SETUP_CLOSED_AND_PRODUCTION_DRAFT

      - name: Explain Google Play limitations
        if: always()
        shell: bash
        run: |
          {
            echo '### RivoScan release preparation'
            echo '- Closed testing: alpha (default closed testing track), only with a saved, eligible AAB.'
            echo '- Production: DRAFT ONLY. The workflow cannot make the app public.'
            echo '- Individual email-list testers must be added in Play Console (Google API limitation).'
            echo '- First upload, signing key, legal declarations, production access and approval cannot be bypassed.'
          } >> "$GITHUB_STEP_SUMMARY"
