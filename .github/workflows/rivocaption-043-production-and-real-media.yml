name: RivoCaption 0.4.3 original signed Google Play production + real screenshots
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: google-play-com.rivocaption.editor
  cancel-in-progress: false
jobs:
  capture-verify-publish:
    runs-on: ubuntu-24.04
    environment: play-testing
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      PACKAGE: com.rivocaption.editor
      VERSION_CODE: '17'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install verified Google Play publisher and image toolkit
        run: |
          set -euo pipefail
          python -m pip install -r tools/play-publisher/requirements.txt 'Pillow>=11,<13'
          python -m py_compile tools/play-publisher/publish.py \
            tools/play-publisher/rivocaption_043_real_media.py \
            tools/play-publisher/rivocaption_043_publish_media.py
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}"
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
      - name: Download the actual signed 0.4.3 candidate and approved app icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rivocaption043-dist /tmp/rivocaption043-real
          gh release download rivocaption-v0.4.3-original-rivoscan \
            --repo univcours/ribhlab --dir /tmp/rivocaption043-dist
          test -s /tmp/rivocaption043-dist/RivoCaption-0.4.3-RivoScan-SIGNED.apk
          test -s /tmp/rivocaption043-dist/RivoCaption-0.4.3-RivoScan-SIGNED.aab
          test -s /tmp/rivocaption043-dist/RivoCaption-PlayStore-512.png
          (cd /tmp/rivocaption043-dist && sha256sum -c SHA256SUMS.txt)
          cp /tmp/rivocaption043-dist/RivoCaption-PlayStore-512.png /tmp/rivocaption-043-approved-icon.png
      - name: Validate APK and AAB with original production upload certificate
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          if [ ! -x "$TOOLS/apksigner" ]; then
            MANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -r | head -1)"
            "$MANAGER" --install 'build-tools;36.0.0'
          fi
          "$TOOLS/aapt" dump badging /tmp/rivocaption043-dist/RivoCaption-0.4.3-RivoScan-SIGNED.apk | grep -F "package: name='com.rivocaption.editor' versionCode='17' versionName='0.4.3'"
          "$TOOLS/apksigner" verify --print-certs /tmp/rivocaption043-dist/RivoCaption-0.4.3-RivoScan-SIGNED.apk > /tmp/rc043verify.txt
          grep -Fqi 'e9b3e2779575ba08a91372fc3885eba01dd3e73e' /tmp/rc043verify.txt
          jarsigner -verify /tmp/rivocaption043-dist/RivoCaption-0.4.3-RivoScan-SIGNED.aab > /tmp/rc043jarverify.txt 2>&1
          grep -Fq 'jar verified' /tmp/rc043jarverify.txt
          keytool -printcert -jarfile /tmp/rivocaption043-dist/RivoCaption-0.4.3-RivoScan-SIGNED.aab | grep -F 'SHA1: E9:B3:E2:77:95:75:BA:08:A9:13:72:FC:38:85:EB:A0:1D:D3:E7:3E'
      - name: Enable KVM for genuine Android 35 UI capture
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Capture genuine running RivoCaption Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 3072M
          disk-size: 2048M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 2048 -no-metrics
          disable-animations: true
          script: |
            python tools/play-publisher/rivocaption_043_real_media.py --apk /tmp/rivocaption043-dist/RivoCaption-0.4.3-RivoScan-SIGNED.apk --output /tmp/rivocaption043-real
      - name: Validate all screenshots, current UI hierarchy, and approved branding
        shell: bash
        run: |
          set -euo pipefail
          python tools/play-publisher/rivocaption_043_publish_media.py \
            --source /tmp/rivocaption043-real
      - name: Archive genuine screenshots for quality audit (no Actions artifact quota)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rivocaption-v0.4.3-genuine-android-media
          name: RivoCaption 0.4.3 — actual Android screenshots (Play media)
          prerelease: true
          body: |
            Five PNG screenshots captured by adb screencap from the signed,
            running RivoCaption Android 0.4.3 application; 1080x1920.
            App icon approved by owner, feature graphic derived from approved icon.
          files: |
            /tmp/rivocaption043-real/phone-01-home.png
            /tmp/rivocaption043-real/phone-02-ai.png
            /tmp/rivocaption043-real/phone-03-styles.png
            /tmp/rivocaption043-real/phone-04-captions.png
            /tmp/rivocaption043-real/phone-05-export.png
            /tmp/rivocaption043-real/icon.png
            /tmp/rivocaption043-real/feature.png
      - name: Publish exactly version 17 on production using existing Play publisher
        shell: bash
        run: |
          set -euo pipefail
          python tools/play-publisher/publish.py \
            --aab /tmp/rivocaption043-dist/RivoCaption-0.4.3-RivoScan-SIGNED.aab \
            --package com.rivocaption.editor \
            --track production --status completed \
            --name 'RivoCaption 0.4.3 (17)' \
            --notes 'New violet-gold app icon and Studio design, improved subtitle editing and safer project saving, with the existing speech and video features preserved.' \
            --language en-US --confirm-production PUBLISH
      - name: Replace icon, feature and real screenshots on all saved Play listing locales
        shell: bash
        run: |
          set -euo pipefail
          python tools/play-publisher/rivocaption_043_publish_media.py \
            --source /tmp/rivocaption043-real --apply \
            --confirm REPLACE_RIVOCAPTION_043_REAL_IMAGES
          echo 'RivoCaption 0.4.3 versionCode 17 production update and real store screenshots committed through the authorized GitHub Play publisher.' >> "$GITHUB_STEP_SUMMARY"
