name: RivoTalk - repair Google Play website for app-ads.txt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivotalk-app-ads-website-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-play-com.ribhlab.rivotalk
  cancel-in-progress: false

jobs:
  repair-rivotalk-website:
    runs-on: ubuntu-latest
    environment: play-testing
    timeout-minutes: 15
    steps:
      - name: Checkout the existing verified RibhLab Play publisher
        uses: actions/checkout@v4
      - name: Prepare Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify that official app page and app-ads.txt are live
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 'https://ribhlab.github.io/rivotalk/' > /tmp/rivotalk.html
          grep -Fq 'RivoTalk' /tmp/rivotalk.html
          curl --fail --silent --show-error --location --retry 3 'https://ribhlab.github.io/app-ads.txt' > /tmp/rivotalk-app-ads.txt
          grep -Fxq 'google.com, pub-7945572016731367, DIRECT, f08c47fec0942fa0' /tmp/rivotalk-app-ads.txt
          echo 'APP_AND_ADS_FILES_VERIFIED'
      - name: Validate the locked RivoTalk website mapping (no Play changes)
        shell: bash
        run: |
          python tools/play-publisher/sync_app_websites.py --package com.ribhlab.rivotalk
      - name: Install existing Google Play Publisher API client
        run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Commit RivoTalk contact website ONLY to Google Play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" || { echo 'GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not configured'; exit 1; }
          python tools/play-publisher/sync_app_websites.py --package com.ribhlab.rivotalk --apply --confirm SET_WEBSITE_ONLY
      - name: Read back RivoTalk contact website from a fresh Play API edit
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PYTHONPATH: tools/play-publisher
        shell: bash
        run: |
          python - <<'PY'
          import json
          from googleapiclient.discovery import build
          from publish import get_credentials
          package='com.ribhlab.rivotalk'
          api=build('androidpublisher','v3',credentials=get_credentials(),cache_discovery=False).edits()
          edit_id=api.insert(packageName=package,body={}).execute()['id']
          try:
              details=api.details().get(packageName=package,editId=edit_id).execute()
              site=details.get('contactWebsite','')
              assert site=='https://ribhlab.github.io/rivotalk/',f'Unexpected Play website: {site!r}'
              print('RIVOTALK_PLAY_WEBSITE_READBACK_OK '+json.dumps({'package':package,'website':site}))
          finally:
              api.delete(packageName=package,editId=edit_id).execute()
          PY
