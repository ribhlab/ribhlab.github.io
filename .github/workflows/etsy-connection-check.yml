name: Etsy Connection — read-only check
on:
  push:
    branches: [main]
    paths:
      - 'tools/etsy-publisher/scripts/check_connection.py'
      - '.github/workflows/etsy-connection-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Etsy grant and read connected shop (no listing changes)
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: python tools/etsy-publisher/scripts/check_connection.py
