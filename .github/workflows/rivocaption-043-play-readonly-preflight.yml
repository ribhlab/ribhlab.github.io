name: RivoCaption 0.4.3 Play access preflight (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivocaption-043-play-readonly-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rivocaption-play-preflight
  cancel-in-progress: false
jobs:
  read-only:
    runs-on: ubuntu-latest
    environment: play-testing
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Play API dependencies
        run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Verify existing RivoCaption Play app access (temporary uncommitted edit)
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
          python tools/play-publisher/check_connection.py \
            --package com.rivocaption.editor --confirm-temp-edit
