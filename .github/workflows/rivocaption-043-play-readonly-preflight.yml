name: RivoCaption 0.4.3 Play access preflight (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivocaption-043-play-readonly-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rivocaption-play-preflight
  cancel-in-progress: false
jobs:
  read-only:
    runs-on: ubuntu-latest
    environment: play-testing
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Play API dependencies
        run: python -m pip install -r tools/play-publisher/requirements.txt
      - name: Check RivoCaption app-level Play API permissions, no edits
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import os,sys
          sys.path.insert(0,"tools/play-publisher")
          from publish import get_credentials
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError
          try:
              assert os.getenv("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"),"Play service account secret missing"
              api=build("androidpublisher","v3",credentials=get_credentials(),cache_discovery=False)
              result=api.applications().get(packageName="com.rivocaption.editor").execute()
              print("RIVOCAPTION_PLAY_APPLICATION_READ=OK")
              print("PACKAGE=com.rivocaption.editor")
              print("DEFAULT_LANGUAGE="+str(result.get("defaultLanguage","unknown")))
          except HttpError as e:
              print("RIVOCAPTION_PLAY_APPLICATION_READ=FAILED")
              print("HTTP_STATUS="+str(e.resp.status))
              raise SystemExit(1)
          except Exception as e:
              print("PREFLIGHT_BLOCKED="+type(e).__name__)
              raise SystemExit(1)
          PY
