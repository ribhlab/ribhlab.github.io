name: Google Play Publisher unit tests
on:
  pull_request:
    paths:
      - 'tools/play-publisher/**'
      - '.github/workflows/google-play-publisher*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image format verifier for NovaGrid asset tests
        run: python -m pip install 'Pillow>=11,<13'
      - name: Compile CLI and tests
        run: python -m compileall -q tools/play-publisher
      - name: Test without credentials or Google API
        run: python -m unittest discover tools/play-publisher -p 'test_*.py' -v
