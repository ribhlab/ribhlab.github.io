name: TradingFiew — activate signed v3 Internal Testing only (no testers)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tradingfiew-internal-testing-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: google-play-com-ribhlab-tradingfiew
  cancel-in-progress: false
jobs:
  internal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: play-testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r tools/play-publisher/requirements.txt
      - name: Release only to no-tester Internal track after exact verification
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}"
          python3 tools/play-publisher/tradingfiew_activate_internal.py
      - name: Verify real release state in Google Play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: PYTHONPATH=tools/play-publisher python3 tools/play-publisher/tradingfiew_play_audit.py
