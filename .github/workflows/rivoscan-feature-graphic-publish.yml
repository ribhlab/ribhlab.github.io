name: RivoScan - publish 1024x500 Google Play feature graphic
on:
  push:
    branches: [main]
    paths:
      - tools/play-publisher/store-listings/rivoscan-feature-request.json
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: google-play-com.ribhlab.rivoscan
  cancel-in-progress: false

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: play-testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and Google Play APIs
        run: |
          python -m pip install -r tools/play-publisher/requirements.txt
          python -m pip install 'Pillow>=11,<13'
      - name: Render and validate the 1024x500 image
        run: python tools/play-publisher/rivoscan_feature_graphic.py
      - name: Save exactly the generated feature graphic for review
        uses: actions/upload-artifact@v4
        with:
          name: RivoScan-Play-Feature-Graphic-1024x500
          path: tools/play-publisher/output/RivoScan_Feature_Graphic_1024x500.jpg
          retention-days: 30
      - name: Upload to Google Play only when explicitly enabled
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          request=json.loads(Path('tools/play-publisher/store-listings/rivoscan-feature-request.json').read_text())
          if set(request)!={'enabled','appId','confirmation'}:
              raise SystemExit('Unexpected request fields')
          if request['appId']!='com.ribhlab.rivoscan':
              raise SystemExit('Wrong package')
          if type(request['enabled']) is not bool:
              raise SystemExit('Invalid enabled field')
          if request['enabled'] and request['confirmation']!='UPLOAD_FEATURE_GRAPHIC':
              raise SystemExit('Missing explicit confirmation')
          with open('/tmp/rivoscan_graphic_enable','w') as o:
              o.write('true' if request['enabled'] else 'false')
          PY
          if [[ "$(cat /tmp/rivoscan_graphic_enable)" != 'true' ]]; then
            echo "FEATURE_GRAPHIC_PREVIEW_ONLY"
            exit 0
          fi
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" || { echo 'Missing Play API secret'; exit 1; }
          python tools/play-publisher/rivoscan_feature_graphic.py --apply --confirm UPLOAD_FEATURE_GRAPHIC
