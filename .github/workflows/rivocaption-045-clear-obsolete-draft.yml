name: RivoCaption code19 - retire only obsolete production code17 draft
on:
  workflow_dispatch:
    inputs:
      expected_source_commit:
        description: 40-hex SHA of the approved and already signed RivoCaption code19 source
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: google-play-com.rivocaption.editor
  cancel-in-progress: false
jobs:
  retire-only-old-draft:
    runs-on: ubuntu-24.04
    environment: play-testing
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install original publisher API dependencies
        run: |
          set -euo pipefail
          python -m pip install -r tools/play-publisher/requirements.txt
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - name: Verify newer RivoCaption code19 original-signed candidate already exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate
          gh release download rivocaption-v0.4.5-original-key-aab \
            --repo univcours/ribhlab --dir candidate
          (cd candidate && sha256sum --check SHA256SUMS.txt)
          grep -Fx 'VERSION_NAME=0.4.5' candidate/SOURCE-IDENTITY.txt
          grep -Fx 'VERSION_CODE=19' candidate/SOURCE-IDENTITY.txt
          grep -Fx 'PACKAGE=com.rivocaption.editor' candidate/SOURCE-IDENTITY.txt
          grep -Fx "SOURCE_COMMIT=$EXPECTED_SOURCE_SHA" candidate/SOURCE-IDENTITY.txt
          jarsigner -verify candidate/RivoCaption-0.4.5-ORIGINAL-KEY-SIGNED.aab > "$RUNNER_TEMP/verify.txt" 2>&1
          grep -Fq 'jar verified' "$RUNNER_TEMP/verify.txt"
          keytool -printcert -jarfile candidate/RivoCaption-0.4.5-ORIGINAL-KEY-SIGNED.aab \
            | grep -F 'SHA1: E9:B3:E2:77:95:75:BA:08:A9:13:72:FC:38:85:EB:A0:1D:D3:E7:3E'
      - name: Retire ONLY draft code17 from RivoCaption, preserve existing published code8
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys,json
          sys.path.insert(0,"tools/play-publisher")
          from googleapiclient.discovery import build
          from publish import get_credentials
          pkg="com.rivocaption.editor"
          edits=build("androidpublisher","v3",credentials=get_credentials(),cache_discovery=False).edits()
          edit_id=edits.insert(packageName=pkg,body={}).execute()["id"]
          committed=False
          try:
              track=edits.tracks().get(packageName=pkg,editId=edit_id,track="production").execute()
              releases=track.get("releases",[])
              print("RIVOCAPTION_RETIRED_DRAFT_PREFLIGHT="+json.dumps([
                  {"status":r.get("status"),"versionCodes":r.get("versionCodes",[])} for r in releases]))
              old_drafts=[r for r in releases if r.get("status")=="draft" and
                          [str(v) for v in r.get("versionCodes",[])]==["17"]]
              published=[r for r in releases if r.get("status")=="completed" and
                         [str(v) for v in r.get("versionCodes",[])]==["8"]]
              if not (len(releases)==2 and len(old_drafts)==1 and len(published)==1):
                  raise RuntimeError("Production state no longer exactly obsolete draft17 + published8: no change")
              result=edits.tracks().update(
                  packageName=pkg,editId=edit_id,track="production",
                  body={"track":"production","releases":published}).execute()
              edited=result.get("releases",[])
              if not (len(edited)==1 and edited[0].get("status")=="completed" and
                      [str(v) for v in edited[0].get("versionCodes",[])]==["8"]):
                  raise RuntimeError("Unexpected edited track: do not commit")
              edits.commit(packageName=pkg,editId=edit_id,
                           changesInReviewBehavior="ERROR_IF_IN_REVIEW").execute()
              committed=True
              print("RIVOCAPTION_ONLY_OBSOLETE_CODE17_DRAFT_RETIRED=TRUE")
          finally:
              if not committed:
                  try:edits.delete(packageName=pkg,editId=edit_id).execute()
                  except Exception:pass
          PY
          echo "Old unreviewed code17 draft retired safely; published code8 retained. Code19 publisher must run separately." >> "$GITHUB_STEP_SUMMARY"
