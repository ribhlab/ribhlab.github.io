plugins { id 'com.android.application' }

android {
    namespace 'com.ribhlab.tinyturboracers'
    compileSdk 36
    defaultConfig {
        applicationId 'com.ribhlab.tinyturboracers'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Lifecycle-aware system Back and predictive back gesture support.
dependencies {
    implementation 'androidx.activity:activity:1.13.0'
}
