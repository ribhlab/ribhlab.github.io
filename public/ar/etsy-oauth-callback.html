<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="الرجوع إلى تطبيق RibhLab Etsy Connect لإكمال ترخيص Etsy بشكل آمن على الهاتف.">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'">
<title>Etsy OAuth — الرجوع لتطبيق Android</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf7f2;color:#24211e;font:16px/1.8 system-ui,sans-serif}.box{box-sizing:border-box;margin:20px;padding:30px;max-width:650px;background:white;border:1px solid #e4dcd2;border-radius:16px}h1{font-size:24px;margin:0 0 10px}.button{display:block;background:#cc5b28;text-align:center;color:white;border-radius:8px;text-decoration:none;padding:13px 18px;margin:18px 0}.button[hidden]{display:none}.note{font-size:14px;color:#685c51}a{color:#963f16}#status{font-weight:600}</style>
</head><body><main id="main" class="box">
<h1>إكمال ربط RibhLab Etsy</h1>
<p id="status">كنتحقق من الرجوع من Etsy…</p>
<a id="return" class="button" hidden>فتح تطبيق RibhLab Etsy Connect لإكمال الربط</a>
<p class="note">هادي صفحة رجوع فقط. ما كتحفظش ولا كتشارك الرمز. استعمل التطبيق على هاتفك باش يكمل التحويل عبر Etsy بأمان، وما ترسلش رابط فيه code لأي شخص.</p>
</main>
<script>
(()=>{
'use strict';
const p=new URLSearchParams(location.search);
const code=p.get('code'), state=p.get('state'), error=p.get('error');
history.replaceState(null,'',location.pathname);
const status=document.getElementById('status'), returnLink=document.getElementById('return');
if(error){status.textContent='Etsy رفضات الترخيص أو وقع خطأ. عاود الربط من تطبيق Android.';return;}
if(!code||!state){status.textContent='الصفحة خدامة. خاصك تبدا الربط من تطبيق Android، ماشي من هنا.';return;}
status.textContent='الموافقة على Etsy تمت. ضغط على الزر باش ترجع للتطبيق ويكمل الربط بلا مشكل CORS.';
const url=new URL('ribhlabetsy://oauth'); url.searchParams.set('code',code);url.searchParams.set('state',state);
returnLink.href=url.href;returnLink.hidden=false;
})();
</script>
</body></html>
