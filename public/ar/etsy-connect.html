<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="ربط متجر Etsy بـ RibhLab Publisher عبر تفويض OAuth 2.0 آمن داخل Chrome.">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'">
<title>ربط Etsy — RibhLab</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf7f2;color:#24211e;font:16px/1.7 system-ui,-apple-system,sans-serif}.box{box-sizing:border-box;margin:16px;padding:28px;max-width:610px;width:100%;background:white;border:1px solid #e4dcd2;border-radius:16px}h1{font-size:24px;margin:0 0 10px}label{display:block;font-weight:bold;margin-top:17px}input{box-sizing:border-box;padding:13px;width:100%;border:1px solid #bbb;border-radius:9px;direction:ltr;text-align:left;font:inherit}button{background:#cc5b28;border:0;color:white;padding:14px;border-radius:9px;width:100%;font:inherit;font-weight:bold;margin-top:12px}button:disabled{background:#b3a9a2}.note{font-size:14px;color:#5c554d}#status{font-weight:600;color:#8b3f21}a{color:#943f1f}</style>
</head>
<body><main class="box" id="main">
<h1>RibhLab Etsy Publisher</h1>
<p>غادي نربطو متجرك بـ Etsy من المتصفح، بلا تثبيت تطبيق. الصفحة ما كتجمعش كلمة السر ولا Shared Secret.</p>
<p>جيب Keystring من <a href="https://www.etsy.com/developers/your-apps" rel="noreferrer">Etsy Developer Apps</a>.</p>
<label for="etsy-client-id">Keystring / API Key</label>
<input id="etsy-client-id" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="لسق Keystring">
<button id="start-oauth" disabled>ربط حساب Etsy</button>
<p id="status" role="status"></p>
<p class="note">خاص أولاً نشر الخادم الآمن المسؤول على تبديل رمز OAuth. الربط كيبدأ فقط من بعد ما تكون الخدمة جاهزة؛ ما تشارك حتى code أو token.</p>
</main><script src="/ar/etsy-bridge-connect.js" defer></script></body></html>
