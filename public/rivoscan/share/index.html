<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share RivoScan | RivoScan</title><meta name="description" content="Share RivoScan for Android with friends and colleagues."><link rel="canonical" href="https://ribhlab.github.io/rivoscan/share/"><style>*{box-sizing:border-box}body{margin:0;font:16px/1.65 system-ui,sans-serif;background:#edf5ff;color:#16324f}main{max-width:900px;margin:auto;padding:28px 20px 60px}nav{display:flex;gap:14px;flex-wrap:wrap}a{color:#075eb7}h1{font-size:clamp(30px,6vw,48px);line-height:1.15}section,article{background:white;border:1px solid #bfd8ef;border-radius:18px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:block;font-weight:650;margin:12px 0 4px}input,textarea,button{font:inherit;max-width:100%}input:not([type=file]),textarea{width:100%;padding:10px;border:1px solid #8ba8c4;border-radius:9px}button,.cta{display:inline-block;border:0;border-radius:12px;padding:11px 16px;background:#075eb7;color:white;font-weight:700;text-decoration:none;cursor:pointer}button:disabled{opacity:.6}button.secondary{background:#e0ecfa;color:#173e66}li{overflow-wrap:anywhere;margin:5px 0}#result{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#4e647a}</style></head><body><main><nav><a href="/rivoscan/">RivoScan</a><a href="/rivoscan/tools/">Free tools</a></nav><h1>Share RivoScan · شارك التطبيق · Partager</h1><p>Scan documents and manage PDF files on Android.</p><p><a class="cta" href="https://play.google.com/store/apps/details?id=com.ribhlab.rivoscan">Google Play</a> <button id="share">Share link / مشاركة</button></p><p id="status" role="status"></p><label for="link">Link</label><input id="link" readonly value="https://play.google.com/store/apps/details?id=com.ribhlab.rivoscan"><section><h2>For creators</h2><p>Show a real scan, then demonstrate the PDF output. Use your own documents without personal information.</p><nav><a hreflang="en" href="/rivoscan/en/">EN</a> <a hreflang="fr" href="/rivoscan/fr/">FR</a> <a hreflang="ar" href="/rivoscan/ar/">AR</a> <a hreflang="es" href="/rivoscan/es/">ES</a> <a hreflang="de" href="/rivoscan/de/">DE</a> <a hreflang="pt" href="/rivoscan/pt/">PT</a> <a hreflang="it" href="/rivoscan/it/">IT</a></nav></section><script>document.querySelector('#share').onclick=async()=>{const url=document.querySelector('#link').value;try{if(navigator.share)await navigator.share({title:'RivoScan',text:'Scan documents and manage PDFs on Android',url});else{await navigator.clipboard.writeText(url);document.querySelector('#status').textContent='Link copied'}}catch(e){if(e.name!=='AbortError'){document.querySelector('#link').select();document.querySelector('#status').textContent='Copy the selected link manually.'}}};</script></main></body></html>
