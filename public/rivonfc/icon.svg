 <radialGradient id="halo"><stop stop-color="#00cfff" stop-opacity=".35"/><stop offset=".62" stop-color="#00d9d0" stop-opacity=".11"/><stop offset="1" stop-color="#00cdce" stop-opacity="0"/></radialGradient>
 <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#36f8ff"/><stop offset=".55" stop-color="#00dce6"/><stop offset="1" stop-color="#44ffc9"/></linearGradient>
