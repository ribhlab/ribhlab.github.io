# Replace univcours/ribhlab-site with your actual public/private repository.
# Sign in with a GitHub fine-grained access token, or configure OAuth (see README).
backend:
  name: github
  repo: univcours/ribhlab-site
  branch: main

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: articles
    label: Articles / المقالات / Articles
    label_singular: Article
    folder: content/articles
    create: true
    extension: json
    format: json
    identifier_field: slug
    slug: "{{slug}}"
    sortable_fields: [date, slug, category]
    summary: "{{slug}} — {{category}}"
    fields:
      - {label: Slug (Latin URL, unique), name: slug, widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase Latin letters, numbers and hyphens']}
      - {label: Category, name: category, widget: select, options: [earning, trading, ai]}
      - {label: Publication date, name: date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false}
      - {label: Updated date, name: updated, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false}
      - {label: Featured, name: featured, widget: boolean, default: false}
      - label: Translations
        name: translations
        widget: object
        fields:
          - label: العربية
            name: ar
            widget: object
            fields: &translatable_fields
              - {label: Title, name: title, widget: string}
              - {label: SEO description, name: excerpt, widget: text}
              - {label: Opening paragraph, name: lead, widget: text}
              - label: Sections
                name: sections
                widget: list
                min: 3
                fields:
                  - {label: Section title, name: heading, widget: string}
                  - {label: Paragraphs, name: paragraphs, widget: list, field: {label: Paragraph, name: text, widget: text}}
                  - {label: Practical checklist, name: bullets, widget: list, required: false, field: {label: Point, name: text, widget: string}}
              - label: FAQ
                name: faq
                widget: list
                required: false
                fields:
                  - {label: Question, name: question, widget: string}
                  - {label: Answer, name: answer, widget: text}
          - label: English
            name: en
            widget: object
            fields: *translatable_fields
          - label: Français
            name: fr
            widget: object
            fields: *translatable_fields
